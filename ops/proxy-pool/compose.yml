services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - proxy_pool_redis:/data

  proxypool:
    build:
      context: https://github.com/Python3WebSpider/ProxyPool.git#cabcd96cc9f30d7bdbc872bb8a8c52760023c142
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
    ports:
      - "127.0.0.1:${PROXY_POOL_PORT:-5555}:5555"
    environment:
      APP_ENV: prod
      API_HOST: 0.0.0.0
      API_PORT: 5555
      API_KEY: ${PROXY_POOL_API_KEY:?set PROXY_POOL_API_KEY in ops/proxy-pool/.env}
      PROXYPOOL_REDIS_HOST: redis
      CYCLE_GETTER: ${CYCLE_GETTER:-300}
      CYCLE_TESTER: ${CYCLE_TESTER:-120}
      GET_TIMEOUT: ${GET_TIMEOUT:-8}
      TEST_TIMEOUT: ${TEST_TIMEOUT:-5}
      TEST_BATCH: ${TEST_BATCH:-20}
      TEST_ANONYMOUS: "false"
      TEST_URL: "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.600519&ut=fa5fd1943c7b386f172d6893dbfba10b&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=1&end=20991231&lmt=1"
      ENABLE_LOG_FILE: "false"

volumes:
  proxy_pool_redis:
