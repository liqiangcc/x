name: Patch Kline Retry Queue Entry

on:
  push:
    branches:
      - refactor/cli-kline-retry-queue-boundary
    paths:
      - .github/workflows/patch-kline-retry-queue-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply scoped retry queue entry migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          source = path.read_text()

          import_anchor = 'const { createKlineRetryCommand } = require("../src/adapters/cli/commands/kline_retry");\n'
          assert source.count(import_anchor) == 1
          assert 'createKlineRetryQueueCommand' not in source
          source = source.replace(
              import_anchor,
              import_anchor + 'const { createKlineRetryQueueCommand } = require("../src/adapters/cli/commands/kline_retry_queue");\n',
              1,
          )

          composition_anchor = 'const commandKlineRetry = createKlineRetryCommand({ root: ROOT });\n'
          assert source.count(composition_anchor) == 1
          source = source.replace(
              composition_anchor,
              composition_anchor + 'const commandKlineRetryQueue = createKlineRetryQueueCommand({ root: ROOT });\n',
              1,
          )

          start_marker = 'async function commandKlineRetryQueue(argv) {'
          end_marker = 'function extractKlineFailures(summary, period) {'
          assert source.count(start_marker) == 1
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          old_block = source[start:end]
          assert 'writeDueCodes' in old_block
          assert 'await commandKlineSync(args);' in old_block
          source = source[:start] + source[end:]

          assert 'async function commandKlineRetryQueue(' not in source
          assert 'writeDueCodes' not in source
          assert 'await commandKlineSync(args);' not in source
          assert source.count('await commandKlineRetryQueue(rest);') == 1
          assert source.count('const commandKlineSync = createKlineSyncCommand({ root: ROOT });') == 1
          assert source.count('await commandKlineSync(rest);') == 1
          assert source.count('async function commandDaily(argv) {') == 1
          assert source.count('const commandKlineFreshness = createKlineFreshnessCommand({ root: ROOT });') == 1

          path.write_text(source)
          PY

      - name: Validate scoped migration
        run: |
          node --check bin/x
          node --test \
            tests/application-kline-retry-queue.test.js \
            tests/cli-kline-retry-queue-command.test.js \
            tests/cli-kline-retry-queue-integration.test.js \
            tests/kline-sync-runner.test.js \
            tests/kline-failure-queue.test.js \
            tests/cli-kline-retry-integration.test.js \
            tests/cli-kline-freshness-integration.test.js \
            tests/cli-kline-aggregate-yearly-integration.test.js \
            tests/cli-kline-validate-integration.test.js \
            tests/cli-kline-sync-control-integration.test.js \
            tests/cli-kline-sync-integration.test.js

      - name: Commit scoped entry migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          if ! git diff --cached --quiet; then
            git commit -m "refactor: delegate kline retry queue CLI"
            git push origin HEAD:${{ github.ref_name }}
          fi
