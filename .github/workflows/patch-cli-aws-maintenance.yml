name: Patch AWS maintenance CLI entry

on:
  push:
    branches:
      - refactor/cli-aws-maintenance-boundary
    paths:
      - .github/workflows/patch-cli-aws-maintenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-aws-maintenance-boundary
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            bin/x
      - name: Patch bin/x
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bin/x")
          text = path.read_text()

          import_anchor = 'const { createAwsProbeRouterCommand } = require("../src/adapters/cli/commands/aws_probe_router");\n'
          import_line = 'const { createAwsMaintenanceCommand } = require("../src/adapters/cli/commands/aws_maintenance");\n'
          assert text.count(import_anchor) == 1
          assert import_line not in text
          text = text.replace(import_anchor, import_anchor + import_line, 1)

          binding_anchor = 'const commandAwsProbeRouter = createAwsProbeRouterCommand();\n'
          binding_line = 'const commandAwsMaintenance = createAwsMaintenanceCommand({ root: ROOT });\n'
          assert text.count(binding_anchor) == 1
          assert binding_line not in text
          text = text.replace(binding_anchor, binding_anchor + binding_line, 1)

          for name in [
            "runAwsKlinePreflight",
            "requireTool",
            "commandAwsStatus",
            "commandAwsSyncGithubSecrets",
          ]:
            pattern = re.compile(rf'\nasync function {name}\([^\n]*\) \{{.*?\n\}}\n', re.S)
            text, count = pattern.subn('\n', text, count=1)
            assert count == 1, (name, count)

          old_start = '''async function commandAws(argv) {
            const subcommand = argv[0];
            if (subcommand === "probe-router") {
              await commandAwsProbeRouter(argv.slice(1));
              return;
            }
            const options = parseOptions(argv.slice(1));
          '''
          new_start = '''async function commandAws(argv) {
            const subcommand = argv[0];
            if (subcommand === "probe-router") {
              await commandAwsProbeRouter(argv.slice(1));
              return;
            }
            if (["status", "sync-github-secrets"].includes(subcommand)) {
              await commandAwsMaintenance(argv);
              return;
            }
            const options = parseOptions(argv.slice(1));
          '''
          assert text.count(old_start) == 1
          text = text.replace(old_start, new_start, 1)

          for branch in [
            '''
            if (subcommand === "status") {
              await commandAwsStatus(options);
              return;
            }
          ''',
            '''
            if (subcommand === "sync-github-secrets") {
              await commandAwsSyncGithubSecrets(options);
              return;
            }
          ''',
          ]:
            assert text.count(branch) == 1
            text = text.replace(branch, '\n', 1)

          maintenance_import = re.compile(
            r'const \{\n'
            r'  AWS_ACCESS_KEY_SECRET,\n'
            r'  AWS_REGION_VARIABLE,\n'
            r'  AWS_SECRET_KEY_SECRET,\n'
            r'  awsProfileEnv,\n'
            r'  buildGithubSecretSetArgs,\n'
            r'  buildGithubVariableSetArgs,\n'
            r'  getAwsCallerIdentity,\n'
            r'  getToolVersion,\n'
            r'  normalizeAwsOptions,\n'
            r'  readAwsProfileCredentials,\n'
            r'  resolveGitHubRepo,\n'
            r'  sanitizeError,\n'
            r'  summarizeCredentials,\n'
            r'\} = require\("\.\./src/aws/maintenance"\);\n'
          )
          text, count = maintenance_import.subn('', text, count=1)
          assert count == 1, count

          if text.count("runCommandWithInput") == 1:
            pattern = re.compile(r'\nfunction runCommandWithInput\([^\n]*\) \{.*?\n\}\n', re.S)
            text, count = pattern.subn('\n', text, count=1)
            assert count == 1, count

          assert 'async function commandAwsStatus(' not in text
          assert 'async function commandAwsSyncGithubSecrets(' not in text
          assert 'async function runAwsKlinePreflight(' not in text
          assert 'async function requireTool(' not in text
          assert 'await commandAwsMaintenance(argv);' in text
          assert 'await commandAwsProbeRouter(argv.slice(1));' in text
          assert 'await commandAws([subcommand, ...rest]);' in text

          path.write_text(text)
          PY
      - name: Validate patch
        run: |
          node --check bin/x
          git diff --check -- bin/x
          git diff -- bin/x
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 1
          git commit -m "refactor(aws): delegate maintenance CLI entry"
          git push origin HEAD:refactor/cli-aws-maintenance-boundary
