name: Patch bin x boundary audit cleanup

on:
  push:
    branches:
      - refactor/bin-x-boundary-audit
    paths:
      - .github/workflows/patch-bin-x-boundary-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/bin-x-boundary-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Remove retired helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          source = path.read_text()

          duration = '''function parseDurationMs(value) {
            const match = String(value ?? "").trim().match(/^(\\d+)(s|m|h)$/i);
            if (!match || Number(match[1]) < 1) {
              throw new Error(`Invalid duration: ${value}. Use values such as 30s, 30m, or 1h.`);
            }
            const multiplier = { s: 1000, m: 60_000, h: 3_600_000 }[match[2].toLowerCase()];
            return Number(match[1]) * multiplier;
          }

          '''
          positive = '''function parsePositiveOption(value, name, fallback) {
            if (value === undefined || value === null || value === "") {
              return fallback;
            }
            const number = Number(value);
            if (!Number.isInteger(number) || number < 1) {
              throw new Error(`${name} must be a positive integer.`);
            }
            return number;
          }

          '''

          # YAML indentation is stripped from the heredoc by the shell block; normalize Python literals explicitly.
          import textwrap
          duration = textwrap.dedent(duration)
          positive = textwrap.dedent(positive)

          assert source.count(duration) == 1, source.count(duration)
          assert source.count(positive) == 1, source.count(positive)
          source = source.replace(duration, "", 1)
          source = source.replace(positive, "", 1)

          assert "function parseDurationMs(" not in source
          assert "function parsePositiveOption(" not in source
          assert "function parsePositiveIntegerOption(" in source
          assert "function parseNonNegativeIntegerOption(" in source

          path.write_text(source)
          PY

      - name: Validate cleanup
        run: |
          node --check bin/x
          node --test \
            tests/cli-bin-x-boundary-audit.test.js \
            tests/cli-proxy-pool-diagnose-integration.test.js \
            tests/cli-proxy-pool-benchmark-integration.test.js \
            tests/cli-proxy-pool-warmup-integration.test.js \
            tests/cli-proxy-pool-probe-integration.test.js
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove retired proxy pool CLI helpers"
          git push origin HEAD:refactor/bin-x-boundary-audit
