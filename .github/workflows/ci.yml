name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Validate security master
        run: node scripts/validate_security_master.js

      - name: CLI smoke test
        run: |
          bin/x doctor
          bin/x --help
          node scripts/probe_official_etf_export.js --help
          node scripts/capture_official_etf_snapshot.js --help
          node scripts/sync_etf_security_master.js --help
