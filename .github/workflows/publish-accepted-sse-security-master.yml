name: Publish Accepted SSE Security Master

on:
  push:
    paths:
      - .github/workflows/publish-accepted-sse-security-master.yml

jobs:
  publish:
    if: github.ref_name == 'feat/mcp-architecture-design'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout accepted target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download accepted SSE artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9174563438'
        run: |
          set -euo pipefail
          curl --fail --location \
            --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output accepted-sse.zip
          mkdir -p accepted-sse
          unzip -q accepted-sse.zip \
            accepted-etf_sse.json \
            accepted-security-master-manifest.json \
            -d accepted-sse

      - name: Verify accepted bytes and semantic contract
        run: |
          set -euo pipefail
          echo 'c15b1afac71c1b903a95e1efc236d7061651d19a273cb5932baeb863109ffa0e  accepted-sse/accepted-etf_sse.json' | sha256sum --check --strict
          echo '2fc44dffa50fbd3d25aed823186b51e66e9dc2efe0ed5d193239b19b77e737d6  accepted-sse/accepted-security-master-manifest.json' | sha256sum --check --strict
          node <<'NODE'
          const fs = require('node:fs');
          const recordFile = JSON.parse(fs.readFileSync('accepted-sse/accepted-etf_sse.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('accepted-sse/accepted-security-master-manifest.json', 'utf8'));
          if (recordFile.schemaVersion !== 1 || recordFile.datasetId !== 'etf_sse') {
            throw new Error('accepted SSE record file identity mismatch.');
          }
          if (recordFile.records?.length !== 917) {
            throw new Error(`accepted SSE record count mismatch: ${recordFile.records?.length}`);
          }
          const summary = recordFile.metadata?.summary;
          if (summary?.etfCount !== 917 || summary?.t0Count !== 192 || summary?.t1Count !== 725) {
            throw new Error(`accepted SSE summary mismatch: ${JSON.stringify(summary)}`);
          }
          const evidence = recordFile.metadata?.source?.evidence;
          if (
            evidence?.allContentHash !== 'sha256:45bbb54598ba6a50af143b096a79fecae693b84cfe24d41f8fb7ae81da65b339'
            || evidence?.t0ContentHash !== 'sha256:b6914ae1fd6099fc80aa5cba20d37ea698b5592a152b428aa05ccee413423fe5'
          ) {
            throw new Error(`accepted SSE provenance hash mismatch: ${JSON.stringify(evidence)}`);
          }
          const matches = manifest.recordSets?.filter(
            (item) => item?.kind === 'record_file'
              && item?.path === 'security_master/records/etf_sse.json'
          ) ?? [];
          if (matches.length !== 1) {
            throw new Error(`accepted manifest must contain exactly one etf_sse record_file: ${JSON.stringify(matches)}`);
          }
          NODE

      - name: Install repository dependencies
        run: npm ci

      - name: Apply accepted bytes to repository working tree
        run: |
          set -euo pipefail
          mkdir -p data/security_master/records
          cp accepted-sse/accepted-etf_sse.json data/security_master/records/etf_sse.json
          cp accepted-sse/accepted-security-master-manifest.json data/security_master/manifest.json
          git diff --check -- data/security_master

      - name: Validate persisted Security Master before commit
        run: node scripts/validate_security_master.js

      - name: Commit accepted SSE Security Master
        run: |
          set -euo pipefail
          git add data/security_master/manifest.json data/security_master/records/etf_sse.json
          if git diff --cached --quiet; then
            echo 'Accepted SSE Security Master is already published.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(security-master): publish accepted SSE ETF snapshot'
          git push origin "HEAD:${GITHUB_REF_NAME}"
