name: Patch proxy probe entry boundary

on:
  push:
    branches:
      - refactor/cli-proxy-probe-boundary
    paths:
      - .github/workflows/patch-proxy-probe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/cli-proxy-probe-boundary
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Patch bin/x
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          source = path.read_text()

          import_anchor = 'const { createProxyPoolDiagnoseCommand } = require("../src/adapters/cli/commands/proxy_pool_diagnose");\n'
          import_replacement = import_anchor + 'const { createProxyPoolProbeCommand } = require("../src/adapters/cli/commands/proxy_pool_probe");\n'
          assert source.count(import_anchor) == 1
          source = source.replace(import_anchor, import_replacement, 1)

          binding_anchor = '''const commandProxyPoolDiagnose = createProxyPoolDiagnoseCommand({
            root: ROOT,
            runsDir: DEFAULT_RUNS_DIR,
            reportWriter: proxyBenchmarkReportWriter,
          });
          const commandDb = createDbCommand();
          '''
          binding_replacement = '''const commandProxyPoolDiagnose = createProxyPoolDiagnoseCommand({
            root: ROOT,
            runsDir: DEFAULT_RUNS_DIR,
            reportWriter: proxyBenchmarkReportWriter,
          });
          const commandProxyPoolProbe = createProxyPoolProbeCommand({
            root: ROOT,
            runsDir: DEFAULT_RUNS_DIR,
            reportWriter: proxyBenchmarkReportWriter,
          });
          const commandDb = createDbCommand();
          '''
          assert source.count(binding_anchor) == 1
          source = source.replace(binding_anchor, binding_replacement, 1)

          route_anchor = '''  if (action === "diagnose") {
            await commandProxyPoolDiagnose(argv.slice(1));
            return;
          }
          const options = parseOptions(argv.slice(1));
          '''
          route_replacement = '''  if (action === "diagnose") {
            await commandProxyPoolDiagnose(argv.slice(1));
            return;
          }
          if (action === "probe") {
            await commandProxyPoolProbe(argv.slice(1));
            return;
          }
          const options = parseOptions(argv.slice(1));
          '''
          assert source.count(route_anchor) == 1
          source = source.replace(route_anchor, route_replacement, 1)

          legacy_start_text = '  if (action === "probe") {\n    const { classifyProxyError, cooldownMs, DEFAULT_STATE_FILE } = require("./../src/proxy/pool");'
          legacy_start = source.index(legacy_start_text)
          legacy_end = source.index('  if (action === "benchmark") {', legacy_start)
          source = source[:legacy_start] + source[legacy_end:]

          assert source.count('createProxyPoolProbeCommand') == 2
          assert 'await commandProxyPoolProbe(argv.slice(1));' in source
          assert legacy_start_text not in source
          assert 'proxyBenchmarkReportWriter.write(report, "probe")' not in source
          assert 'proxyBenchmarkReportWriter.write(report, "benchmark")' in source
          assert 'proxyBenchmarkReportWriter.write(report, "warmup")' in source
          assert 'if (action === "benchmark")' in source
          assert 'if (action === "warmup")' in source

          path.write_text(source)
          PY

      - name: Validate patch
        run: |
          node --check bin/x
          node --check src/application/proxy/probe_proxy_pool.js
          node --check src/ports/proxy/proxy_probe.js
          node --check src/adapters/proxy/proxy_pool_probe_session.js
          node --check src/adapters/cli/commands/proxy_pool_probe.js
          node --test \
            tests/application-proxy-probe.test.js \
            tests/proxy-probe-adapters.test.js \
            tests/cli-proxy-pool-probe-command.test.js \
            tests/cli-proxy-pool-probe-integration.test.js \
            tests/application-proxy-diagnostics.test.js \
            tests/proxy-diagnostic-adapters.test.js \
            tests/cli-proxy-pool-diagnose-command.test.js \
            tests/cli-proxy-pool-diagnose-integration.test.js
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate proxy pool probe from CLI"
          git push origin HEAD:refactor/cli-proxy-probe-boundary
