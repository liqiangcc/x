name: Patch Proxy router boundary

on:
  push:
    branches:
      - refactor/cli-proxy-router-boundary
    paths:
      - .github/workflows/patch-proxy-router-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-proxy-router-boundary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Proxy router boundary
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          bin_path = root / 'bin/x'
          source = bin_path.read_text()

          import_anchor = 'const { createProxyClashCommand } = require("../src/adapters/cli/commands/proxy_clash");\n'
          router_import = 'const { createProxyCommand } = require("../src/adapters/cli/commands/proxy");\n'
          if router_import not in source:
              if import_anchor not in source:
                  raise SystemExit('Proxy import anchor not found')
              source = source.replace(import_anchor, router_import + import_anchor, 1)

          composition_anchor = 'const commandProxyClash = createProxyClashCommand();\n'
          composition = composition_anchor + (
              'const commandProxy = createProxyCommand({\n'
              '  clashCommand: commandProxyClash,\n'
              '  poolCommand: commandProxyPool,\n'
              '});\n'
          )
          if 'const commandProxy = createProxyCommand({' not in source:
              if composition_anchor not in source:
                  raise SystemExit('Proxy composition anchor not found')
              source = source.replace(composition_anchor, composition, 1)

          if source.count('async function commandProxy(argv) {') != 1:
              raise SystemExit('expected exactly one inline commandProxy')
          if source.count('async function commandProxyPool(argv) {') != 1:
              raise SystemExit('expected exactly one commandProxyPool before patch')

          pattern = re.compile(
              r'\nasync function commandProxy\(argv\) \{.*?\n\}\n\n(?=async function commandProxyPool\(argv\))',
              re.S,
          )
          source, count = pattern.subn('\n', source, count=1)
          if count != 1:
              raise SystemExit(f'expected one inline commandProxy block, found {count}')

          if 'async function commandProxy(argv) {' in source:
              raise SystemExit('inline commandProxy still present')
          if 'async function commandProxyPool(argv) {' not in source:
              raise SystemExit('commandProxyPool was unexpectedly removed')
          if 'await commandProxy([subcommand, ...rest]);' not in source:
              raise SystemExit('top-level proxy route changed unexpectedly')
          bin_path.write_text(source)

          clash_test = root / 'tests/cli-proxy-clash-integration.test.js'
          text = clash_test.read_text()
          old = '''test("bin/x delegates clash commands while preserving proxy-pool routing", async () => {
            const source = await fs.readFile(BIN, "utf8");
            const start = source.indexOf("async function commandProxy(argv) {");
            const end = source.indexOf("async function commandProxyPool(argv) {", start);

            assert.notEqual(start, -1);
            assert.notEqual(end, -1);

            const router = source.slice(start, end);
            assert.match(source, /createProxyClashCommand/);
            assert.match(router, /if \\(subcommand === "pool"\\)[\\s\\S]*?await commandProxyPool\\(argv\\.slice\\(1\\)\\);/);
            assert.match(router, /await commandProxyClash\\(argv\\);/);
            assert.doesNotMatch(router, /parseOptions\\(/);
            assert.doesNotMatch(router, /checkEastmoneyAccess/);
            assert.doesNotMatch(router, /listProxies/);
            assert.doesNotMatch(router, /rotateProxy/);
            assert.doesNotMatch(source, /require\\("\\.\\.\\/src\\/proxy\\/clash"\\)/);
            assert.doesNotMatch(source, /require\\("\\.\\.\\/\\.\\.\\/src\\/proxy\\/clash"\\)/);
          });
'''
          new = '''test("bin/x delegates clash commands through the parent proxy adapter while preserving proxy-pool routing", async () => {
            const source = await fs.readFile(BIN, "utf8");

            assert.match(source, /createProxyCommand/);
            assert.match(source, /createProxyClashCommand/);
            assert.match(source, /clashCommand: commandProxyClash/);
            assert.match(source, /poolCommand: commandProxyPool/);
            assert.doesNotMatch(source, /async function commandProxy\\(argv\\)/);
            assert.match(source, /async function commandProxyPool\\(argv\\)/);
            assert.doesNotMatch(source, /await commandProxyClash\\(argv\\)/);
            assert.doesNotMatch(source, /await commandProxyPool\\(argv\\.slice\\(1\\)\\)/);
            assert.doesNotMatch(source, /require\\("\\.\\.\\/src\\/proxy\\/clash"\\)/);
            assert.doesNotMatch(source, /require\\("\\.\\.\\/\\.\\.\\/src\\/proxy\\/clash"\\)/);
          });
'''
          if old not in text:
              raise SystemExit('proxy clash integration boundary anchor not found')
          clash_test.write_text(text.replace(old, new, 1))
          PY

          cat > src/adapters/cli/commands/proxy.js <<'EOF'
          "use strict";

          function requireCommand(command, label) {
            if (typeof command !== "function") {
              throw new TypeError(`${label} must be a function.`);
            }
            return command;
          }

          async function runProxyCommand({
            argv = [],
            clashCommand,
            poolCommand,
          } = {}) {
            const action = argv[0];

            if (action === "pool") {
              await requireCommand(poolCommand, "poolCommand")(argv.slice(1));
              return;
            }

            await requireCommand(clashCommand, "clashCommand")(argv);
          }

          function createProxyCommand({
            clashCommand,
            poolCommand,
          } = {}) {
            const resolvedClashCommand = requireCommand(clashCommand, "clashCommand");
            const resolvedPoolCommand = requireCommand(poolCommand, "poolCommand");

            return (argv = []) => runProxyCommand({
              argv,
              clashCommand: resolvedClashCommand,
              poolCommand: resolvedPoolCommand,
            });
          }

          module.exports = {
            createProxyCommand,
            runProxyCommand,
          };
          EOF

          cat > tests/cli-proxy-command.test.js <<'EOF'
          "use strict";

          const assert = require("node:assert/strict");
          const test = require("node:test");
          const { createProxyCommand } = require("../src/adapters/cli/commands/proxy");

          test("proxy router strips only the pool parent token", async () => {
            const calls = [];
            const command = createProxyCommand({
              clashCommand: async (argv) => calls.push(["clash", argv]),
              poolCommand: async (argv) => calls.push(["pool", argv]),
            });

            assert.equal(await command(["pool", "status", "--json"]), undefined);
            assert.deepEqual(calls, [["pool", ["status", "--json"]]]);
          });

          test("proxy router forwards every non-pool action unchanged to clash", async () => {
            const calls = [];
            const command = createProxyCommand({
              clashCommand: async (argv) => calls.push(argv),
              poolCommand: async () => assert.fail("pool must not run"),
            });

            await command(["list", "--group", "fast"]);
            await command(["unknown", "--value", "x"]);
            await command([]);

            assert.deepEqual(calls, [
              ["list", "--group", "fast"],
              ["unknown", "--value", "x"],
              [],
            ]);
          });

          test("proxy router requires both child command dependencies", () => {
            assert.throws(
              () => createProxyCommand({ clashCommand: async () => {} }),
              /poolCommand must be a function\./
            );
            assert.throws(
              () => createProxyCommand({ poolCommand: async () => {} }),
              /clashCommand must be a function\./
            );
          });
          EOF

          cat > tests/cli-proxy-integration.test.js <<'EOF'
          "use strict";

          const assert = require("node:assert/strict");
          const { execFile } = require("node:child_process");
          const fs = require("node:fs/promises");
          const path = require("node:path");
          const test = require("node:test");
          const { promisify } = require("node:util");

          const execFileAsync = promisify(execFile);
          const ROOT = path.resolve(__dirname, "..");
          const BIN = path.join(ROOT, "bin", "x");

          async function runCli(args) {
            try {
              const result = await execFileAsync(process.execPath, [BIN, ...args], { cwd: ROOT });
              return { ...result, exitCode: 0 };
            } catch (error) {
              return {
                exitCode: error.code,
                stdout: error.stdout ?? "",
                stderr: error.stderr ?? "",
              };
            }
          }

          test("real proxy parent router preserves clash unknown-command protocol", async () => {
            const unknown = await runCli(["proxy", "unknown"]);
            assert.equal(unknown.exitCode, 1);
            assert.equal(unknown.stdout, "");
            assert.equal(unknown.stderr, "Unknown proxy command: unknown\n");

            const malformed = await runCli(["proxy", "unknown", "--value"]);
            assert.equal(malformed.exitCode, 1);
            assert.equal(malformed.stdout, "");
            assert.equal(malformed.stderr, "Missing value for --value\n");
          });

          test("bin/x delegates the proxy family through one parent CLI adapter", async () => {
            const source = await fs.readFile(BIN, "utf8");
            assert.match(source, /createProxyCommand/);
            assert.match(source, /const commandProxy = createProxyCommand\(\{/);
            assert.match(source, /clashCommand: commandProxyClash/);
            assert.match(source, /poolCommand: commandProxyPool/);
            assert.match(source, /await commandProxy\(\[subcommand, \.\.\.rest\]\);/);
            assert.doesNotMatch(source, /async function commandProxy\(argv\)/);
            assert.match(source, /async function commandProxyPool\(argv\)/);
            assert.doesNotMatch(source, /await commandProxyClash\(argv\)/);
            assert.doesNotMatch(source, /await commandProxyPool\(argv\.slice\(1\)\)/);
          });
          EOF

      - name: Validate targeted Proxy boundary
        run: |
          node --check bin/x
          node --check src/adapters/cli/commands/proxy.js
          node --test \
            tests/cli-proxy-command.test.js \
            tests/cli-proxy-integration.test.js \
            tests/cli-proxy-clash-command.test.js \
            tests/cli-proxy-clash-integration.test.js \
            tests/cli-proxy-pool-lifecycle-command.test.js \
            tests/cli-bin-x-boundary-audit.test.js

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x src/adapters/cli/commands/proxy.js tests/cli-proxy-command.test.js tests/cli-proxy-integration.test.js tests/cli-proxy-clash-integration.test.js
          git commit -m "refactor: separate proxy router from CLI entry"
          git push origin HEAD:refactor/cli-proxy-router-boundary
