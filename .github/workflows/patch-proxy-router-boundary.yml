name: Patch Proxy router boundary

on:
  push:
    branches:
      - refactor/cli-proxy-router-boundary
    paths:
      - .github/workflows/patch-proxy-router-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-proxy-router-boundary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch proxy entry
        run: node .github/patch-proxy-router-boundary.cjs

      - name: Validate targeted Proxy boundary
        run: |
          node --check bin/x
          node --check src/adapters/cli/commands/proxy.js
          node --test \
            tests/cli-proxy-command.test.js \
            tests/cli-proxy-integration.test.js \
            tests/cli-proxy-clash-command.test.js \
            tests/cli-proxy-clash-integration.test.js \
            tests/cli-proxy-pool-lifecycle-command.test.js \
            tests/cli-bin-x-boundary-audit.test.js

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git commit -m "refactor: separate proxy router from CLI entry"
          git push origin HEAD:refactor/cli-proxy-router-boundary
