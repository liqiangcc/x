name: Apply complete architecture refactor

on:
  push:
    branches:
      - refactor/complete-architecture-boundaries
    paths:
      - .github/workflows/apply-complete-architecture-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fixed refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/complete-architecture-boundaries
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Daily and CLI composition boundaries
        run: python3 tools/apply_complete_architecture_refactor.py

      - name: Verify generated JavaScript syntax
        run: |
          node --check bin/x
          node --check src/application/daily/run_daily_pipeline.js
          node --check src/adapters/cli/commands/daily.js
          node --check src/adapters/cli/root_router.js
          node --check src/adapters/cli/usage.js
          node --check src/composition/cli_application.js

      - name: Run full test suite
        run: npm test

      - name: Remove one-shot tooling
        run: |
          rm -f .github/workflows/export-refactor-source.yml
          rm -f .github/workflows/apply-complete-architecture-refactor.yml
          rm -f tools/apply_complete_architecture_refactor.py
          rm -f REFACTOR_TRANSFORM_REPORT.txt

      - name: Commit verified refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor: complete Daily and CLI architecture boundaries"
          git push origin HEAD:refactor/complete-architecture-boundaries
