name: Patch Kline Sync Boundary V2

on:
  push:
    branches: [refactor/cli-kline-sync-boundary]
    paths: [.github/workflows/patch-kline-sync-boundary-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-kline-sync-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply scoped refactor
        shell: bash
        run: |
          set -euo pipefail
          cat > src/adapters/cli/commands/kline_sync.js <<'EOF'
          "use strict";

          const { parseCliOptions } = require("../option_parser");

          function appendKlineSyncOptions(args, options, { includeOutputDir = true } = {}) {
            if (options.policy) args.push("--policy", options.policy);
            if (options.refreshMode) args.push("--refresh-mode", options.refreshMode);
            if (options.checkpointEvery) args.push("--checkpoint-every", String(options.checkpointEvery));
            if (options.proxyPreflight) args.push("--proxy-preflight");
            if (options.noProxyPreflight) args.push("--no-proxy-preflight");
            if (options.proxyMinAvailable) args.push("--proxy-min-available", String(options.proxyMinAvailable));
            if (options.proxyMinSuccessRate) args.push("--proxy-min-success-rate", String(options.proxyMinSuccessRate));
            if (options.proxyMaxP95Ms) args.push("--proxy-max-p95-ms", String(options.proxyMaxP95Ms));
            if (options.proxyPreflightConcurrency) args.push("--proxy-preflight-concurrency", String(options.proxyPreflightConcurrency));
            if (options.proxyPreflightTimeoutMs) args.push("--proxy-preflight-timeout-ms", String(options.proxyPreflightTimeoutMs));
            if (options.failureQueue) args.push("--failure-queue", options.failureQueue);
            if (options.limit) args.push("--limit", String(options.limit));
            if (options.batchSize) args.push("--batch-size", String(options.batchSize));
            if (options.offset) args.push("--offset", String(options.offset));
            if (includeOutputDir && options.outputDir) args.push("--output-dir", options.outputDir);
            if (options.force) args.push("--force");
            if (options.concurrency) args.push("--concurrency", String(options.concurrency));
            if (options.retryAttempts) args.push("--retry-attempts", String(options.retryAttempts));
            if (options.retryDelayMs) args.push("--retry-delay-ms", String(options.retryDelayMs));
            if (options.retryConcurrency) args.push("--retry-concurrency", String(options.retryConcurrency));
            if (options.awsRegion) args.push("--aws-region", options.awsRegion);
            if (options.routerRegion) args.push("--router-region", options.routerRegion);
            if (options.proxyPoolUrl) args.push("--proxy-pool-url", options.proxyPoolUrl);
            if (options.proxyMaxAttempts) args.push("--proxy-max-attempts", String(options.proxyMaxAttempts));
            if (options.huaweicloudRegion) args.push("--huaweicloud-region", options.huaweicloudRegion);
            if (options.huaweicloudRegionStartIndex) args.push("--huaweicloud-region-start-index", String(options.huaweicloudRegionStartIndex));
            if (options.huaweicloudTargets) args.push("--huaweicloud-targets", options.huaweicloudTargets);
            if (options.lambdaName) args.push("--lambda-name", options.lambdaName);
            if (options.config) args.push("--config", options.config);
            if (options.minSuccessRate) args.push("--min-success-rate", String(options.minSuccessRate));
            if (options.expectedLatestDate) args.push("--expected-latest-date", String(options.expectedLatestDate));
            if (options.freshnessCodes) args.push("--freshness-codes", String(options.freshnessCodes));
            return args;
          }

          function buildKlineSyncArgs(options) {
            const inputPath = options._[0];
            if (!inputPath) throw new Error("kline sync requires <input_dir|codes.json>");
            if (options.policy && options.engine) throw new Error("--policy and --engine cannot be used together.");
            const args = [inputPath, "--period", options.period];
            if (options.engine) args.push("--engine", options.engine);
            return appendKlineSyncOptions(args, options);
          }

          async function runKlineSyncCommand({ argv = [], nodeScriptRunner, createNodeScriptRunner, stdout = process.stdout, stderr = process.stderr } = {}) {
            const options = parseCliOptions(argv, { period: "daily" });
            const args = buildKlineSyncArgs(options);
            const runner = nodeScriptRunner ?? createNodeScriptRunner?.();
            if (typeof runner !== "function") throw new TypeError("kline sync node script runner must be a function.");
            const result = await runner("fetch/query_pool_klines.js", args);
            stdout.write(result?.stdout ?? "");
            stderr.write(result?.stderr ?? "");
            return { args, result };
          }

          function createKlineSyncCommand({ root, nodeScriptRunner, createNodeScriptRunner, stdout = process.stdout, stderr = process.stderr } = {}) {
            let defaultRunner;
            const resolveRunner = () => {
              if (nodeScriptRunner) return nodeScriptRunner;
              if (createNodeScriptRunner) return createNodeScriptRunner({ root });
              const { createNodeScriptRunner: createDefault } = require("../../system/node_script_runner");
              defaultRunner ??= createDefault({ root });
              return defaultRunner;
            };
            return (argv = []) => runKlineSyncCommand({ argv, createNodeScriptRunner: resolveRunner, stdout, stderr });
          }

          module.exports = { appendKlineSyncOptions, buildKlineSyncArgs, createKlineSyncCommand, runKlineSyncCommand };
          EOF

          cat > tests/cli-kline-sync-command.test.js <<'EOF'
          "use strict";
          const assert = require("node:assert/strict");
          const test = require("node:test");
          const { appendKlineSyncOptions, buildKlineSyncArgs, createKlineSyncCommand, runKlineSyncCommand } = require("../src/adapters/cli/commands/kline_sync");

          function sink() { let text = ""; return { write(v) { text += String(v); }, get text() { return text; } }; }

          test("kline sync validates before resolving process infrastructure", async () => {
            let resolutions = 0;
            const factory = () => { resolutions += 1; return async () => ({}); };
            await assert.rejects(runKlineSyncCommand({ argv: [], createNodeScriptRunner: factory }), /kline sync requires <input_dir\|codes\.json>/);
            await assert.rejects(runKlineSyncCommand({ argv: ["codes.json", "--policy", "p", "--engine", "aws"], createNodeScriptRunner: factory }), /--policy and --engine cannot be used together\./);
            assert.equal(resolutions, 0);
          });

          test("kline sync preserves invocation and output protocol", async () => {
            const calls = []; const stdout = sink(); const stderr = sink();
            const result = await runKlineSyncCommand({
              argv: ["codes.json", "--engine", "aws", "--limit", "10", "--force"],
              nodeScriptRunner: async (...args) => { calls.push(args); return { stdout: "ok\n", stderr: "warn\n" }; }, stdout, stderr,
            });
            assert.deepEqual(calls, [["fetch/query_pool_klines.js", ["codes.json", "--period", "daily", "--engine", "aws", "--limit", "10", "--force"]]]);
            assert.deepEqual(result.args, calls[0][1]); assert.equal(stdout.text, "ok\n"); assert.equal(stderr.text, "warn\n");
          });

          test("shared mapper stays reusable by retry and daily", () => {
            const args = [];
            appendKlineSyncOptions(args, { policy: "p", outputDir: "out", concurrency: "4", retryAttempts: "3", expectedLatestDate: "20260817", freshnessCodes: "fresh.json" });
            assert.deepEqual(args, ["--policy", "p", "--output-dir", "out", "--concurrency", "4", "--retry-attempts", "3", "--expected-latest-date", "20260817", "--freshness-codes", "fresh.json"]);
          });

          test("factory forwards root lazily and builder preserves explicit period", async () => {
            const roots = [];
            const command = createKlineSyncCommand({ root: "/repo", createNodeScriptRunner({ root }) { roots.push(root); return async () => ({ stdout: "", stderr: "" }); } });
            await command(["codes.json"]); assert.deepEqual(roots, ["/repo"]);
            assert.deepEqual(buildKlineSyncArgs({ _: ["pool"], period: "yearly", policy: "p" }), ["pool", "--period", "yearly", "--policy", "p"]);
          });
          EOF

          cat > tests/cli-kline-sync-integration.test.js <<'EOF'
          "use strict";
          const assert = require("node:assert/strict");
          const fs = require("node:fs/promises");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");
          const test = require("node:test");
          const ROOT = path.resolve(__dirname, ".."); const BIN = path.join(ROOT, "bin", "x");
          function runCli(args) { return spawnSync(process.execPath, [BIN, ...args], { cwd: ROOT, encoding: "utf8" }); }

          test("real CLI preserves kline sync protocol errors", () => {
            for (const { args, error } of [
              { args: ["kline", "sync"], error: "kline sync requires <input_dir|codes.json>\n" },
              { args: ["kline", "sync", "codes.json", "--limit"], error: "Missing value for --limit\n" },
              { args: ["kline", "sync", "codes.json", "--policy", "p", "--engine", "aws"], error: "--policy and --engine cannot be used together.\n" },
            ]) { const r = runCli(args); assert.equal(r.status, 1, args.join(" ")); assert.equal(r.stdout, ""); assert.equal(r.stderr, error); }
          });

          test("bin/x delegates kline sync and retains shared mapping consumers", async () => {
            const source = await fs.readFile(BIN, "utf8");
            assert.match(source, /createKlineSyncCommand/);
            assert.match(source, /const commandKlineSync = createKlineSyncCommand\(\{ root: ROOT \}\);/);
            assert.match(source, /await commandKlineSync\(rest\);/);
            assert.doesNotMatch(source, /async function commandKlineSync\(/);
            assert.doesNotMatch(source, /function appendKlineSyncOptions\(/);
            assert.match(source, /appendKlineSyncOptions\(args, \{/);
            assert.match(source, /async function commandKlineRetry\(/);
            assert.match(source, /async function commandDaily\(/);
          });
          EOF

          node <<'NODE'
          const fs = require("node:fs");
          let source = fs.readFileSync("bin/x", "utf8");
          const importAnchor = 'const { createCodesBuildCommand } = require("../src/adapters/cli/commands/codes_build");\n';
          const importLine = 'const { appendKlineSyncOptions, createKlineSyncCommand } = require("../src/adapters/cli/commands/kline_sync");\n';
          const compositionAnchor = 'const commandCodesBuild = createCodesBuildCommand({ root: ROOT });\n';
          const compositionLine = 'const commandKlineSync = createKlineSyncCommand({ root: ROOT });\n';
          if (!source.includes(importAnchor) || !source.includes(compositionAnchor)) throw new Error("missing kline sync composition anchor");
          source = source.replace(importAnchor, importAnchor + importLine).replace(compositionAnchor, compositionAnchor + compositionLine);
          const start = source.indexOf("function appendKlineSyncOptions(");
          const end = source.indexOf("async function loadCodesInput(", start);
          if (start < 0 || end < 0) throw new Error("missing kline sync extraction anchors");
          source = source.slice(0, start) + source.slice(end);
          fs.writeFileSync("bin/x", source);

          const codesTest = "tests/cli-codes-build-integration.test.js";
          let testSource = fs.readFileSync(codesTest, "utf8");
          testSource = testSource
            .replace("bin/x delegates codes build while leaving kline sync and daily orchestration scoped for later", "bin/x delegates codes build and kline sync while daily orchestration remains independent")
            .replace("  assert.match(source, /async function commandKlineSync\\(/);", "  assert.match(source, /createKlineSyncCommand/);\n  assert.doesNotMatch(source, /async function commandKlineSync\\(/);");
          fs.writeFileSync(codesTest, testSource);
          NODE

          node --check bin/x
          node --check src/adapters/cli/commands/kline_sync.js
          node --test tests/cli-kline-sync-command.test.js tests/cli-kline-sync-integration.test.js tests/cli-codes-build-integration.test.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x src/adapters/cli/commands/kline_sync.js tests/cli-kline-sync-command.test.js tests/cli-kline-sync-integration.test.js tests/cli-codes-build-integration.test.js
          git commit -m "refactor: separate kline sync from CLI entry"
          git push origin HEAD:refactor/cli-kline-sync-boundary
