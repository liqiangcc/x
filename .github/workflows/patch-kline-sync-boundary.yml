name: Patch Kline Sync Boundary

on:
  push:
    branches:
      - refactor/cli-kline-sync-boundary
    paths:
      - .github/workflows/patch-kline-sync-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-kline-sync-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped refactor
        shell: bash
        run: |
          set -euo pipefail
          cat > src/adapters/cli/commands/kline_sync.js <<'EOF'
          "use strict";

          const { parseCliOptions } = require("../option_parser");

          function appendKlineSyncOptions(args, options, { includeOutputDir = true } = {}) {
            if (options.policy) args.push("--policy", options.policy);
            if (options.refreshMode) args.push("--refresh-mode", options.refreshMode);
            if (options.checkpointEvery) args.push("--checkpoint-every", String(options.checkpointEvery));
            if (options.proxyPreflight) args.push("--proxy-preflight");
            if (options.noProxyPreflight) args.push("--no-proxy-preflight");
            if (options.proxyMinAvailable) args.push("--proxy-min-available", String(options.proxyMinAvailable));
            if (options.proxyMinSuccessRate) args.push("--proxy-min-success-rate", String(options.proxyMinSuccessRate));
            if (options.proxyMaxP95Ms) args.push("--proxy-max-p95-ms", String(options.proxyMaxP95Ms));
            if (options.proxyPreflightConcurrency) args.push("--proxy-preflight-concurrency", String(options.proxyPreflightConcurrency));
            if (options.proxyPreflightTimeoutMs) args.push("--proxy-preflight-timeout-ms", String(options.proxyPreflightTimeoutMs));
            if (options.failureQueue) args.push("--failure-queue", options.failureQueue);
            if (options.limit) args.push("--limit", String(options.limit));
            if (options.batchSize) args.push("--batch-size", String(options.batchSize));
            if (options.offset) args.push("--offset", String(options.offset));
            if (includeOutputDir && options.outputDir) args.push("--output-dir", options.outputDir);
            if (options.force) args.push("--force");
            if (options.concurrency) args.push("--concurrency", String(options.concurrency));
            if (options.retryAttempts) args.push("--retry-attempts", String(options.retryAttempts));
            if (options.retryDelayMs) args.push("--retry-delay-ms", String(options.retryDelayMs));
            if (options.retryConcurrency) args.push("--retry-concurrency", String(options.retryConcurrency));
            if (options.awsRegion) args.push("--aws-region", options.awsRegion);
            if (options.routerRegion) args.push("--router-region", options.routerRegion);
            if (options.proxyPoolUrl) args.push("--proxy-pool-url", options.proxyPoolUrl);
            if (options.proxyMaxAttempts) args.push("--proxy-max-attempts", String(options.proxyMaxAttempts));
            if (options.huaweicloudRegion) args.push("--huaweicloud-region", options.huaweicloudRegion);
            if (options.huaweicloudRegionStartIndex) args.push("--huaweicloud-region-start-index", String(options.huaweicloudRegionStartIndex));
            if (options.huaweicloudTargets) args.push("--huaweicloud-targets", options.huaweicloudTargets);
            if (options.lambdaName) args.push("--lambda-name", options.lambdaName);
            if (options.config) args.push("--config", options.config);
            if (options.minSuccessRate) args.push("--min-success-rate", String(options.minSuccessRate));
            if (options.expectedLatestDate) args.push("--expected-latest-date", String(options.expectedLatestDate));
            if (options.freshnessCodes) args.push("--freshness-codes", String(options.freshnessCodes));
            return args;
          }

          function buildKlineSyncArgs(options) {
            const inputPath = options._[0];
            if (!inputPath) {
              throw new Error("kline sync requires <input_dir|codes.json>");
            }
            if (options.policy && options.engine) {
              throw new Error("--policy and --engine cannot be used together.");
            }

            const args = [inputPath, "--period", options.period];
            if (options.engine) args.push("--engine", options.engine);
            return appendKlineSyncOptions(args, options);
          }

          function requireNodeScriptRunner(value) {
            if (typeof value !== "function") {
              throw new TypeError("kline sync node script runner must be a function.");
            }
            return value;
          }

          async function runKlineSyncCommand({
            argv = [],
            nodeScriptRunner,
            createNodeScriptRunner,
            stdout = process.stdout,
            stderr = process.stderr,
          } = {}) {
            const options = parseCliOptions(argv, { period: "daily" });
            const args = buildKlineSyncArgs(options);
            const runNodeScript = requireNodeScriptRunner(
              nodeScriptRunner ?? createNodeScriptRunner?.(),
            );
            const result = await runNodeScript("fetch/query_pool_klines.js", args);
            stdout.write(result?.stdout ?? "");
            stderr.write(result?.stderr ?? "");
            return { args, result };
          }

          function createKlineSyncCommand({
            root,
            nodeScriptRunner,
            createNodeScriptRunner,
            stdout = process.stdout,
            stderr = process.stderr,
          } = {}) {
            let defaultRunner = null;
            function resolveNodeScriptRunner() {
              if (nodeScriptRunner) return nodeScriptRunner;
              if (createNodeScriptRunner) return createNodeScriptRunner({ root });
              const {
                createNodeScriptRunner: createDefaultNodeScriptRunner,
              } = require("../../system/node_script_runner");
              defaultRunner ??= createDefaultNodeScriptRunner({ root });
              return defaultRunner;
            }

            return (argv = []) => runKlineSyncCommand({
              argv,
              createNodeScriptRunner: resolveNodeScriptRunner,
              stdout,
              stderr,
            });
          }

          module.exports = {
            appendKlineSyncOptions,
            buildKlineSyncArgs,
            createKlineSyncCommand,
            runKlineSyncCommand,
          };
          EOF

          cat > tests/cli-kline-sync-command.test.js <<'EOF'
          "use strict";

          const assert = require("node:assert/strict");
          const test = require("node:test");
          const {
            appendKlineSyncOptions,
            buildKlineSyncArgs,
            createKlineSyncCommand,
            runKlineSyncCommand,
          } = require("../src/adapters/cli/commands/kline_sync");

          function sink() {
            let text = "";
            return { write(value) { text += String(value); }, get text() { return text; } };
          }

          test("kline sync requires input before resolving process infrastructure", async () => {
            let resolutions = 0;
            await assert.rejects(
              runKlineSyncCommand({
                argv: [],
                createNodeScriptRunner() { resolutions += 1; return async () => ({}); },
              }),
              /kline sync requires <input_dir\|codes\.json>/,
            );
            assert.equal(resolutions, 0);
          });

          test("kline sync rejects policy and engine together before resolving runner", async () => {
            let resolutions = 0;
            await assert.rejects(
              runKlineSyncCommand({
                argv: ["codes.json", "--policy", "proxy-only", "--engine", "aws"],
                createNodeScriptRunner() { resolutions += 1; return async () => ({}); },
              }),
              /--policy and --engine cannot be used together\./,
            );
            assert.equal(resolutions, 0);
          });

          test("kline sync preserves default period and exact script invocation", async () => {
            const calls = [];
            const stdout = sink();
            const stderr = sink();
            const result = await runKlineSyncCommand({
              argv: ["codes.json", "--engine", "aws", "--limit", "10", "--force"],
              nodeScriptRunner: async (...args) => {
                calls.push(args);
                return { stdout: "ok\n", stderr: "warn\n" };
              },
              stdout,
              stderr,
            });
            assert.deepEqual(calls, [["fetch/query_pool_klines.js", [
              "codes.json", "--period", "daily", "--engine", "aws", "--limit", "10", "--force",
            ]]]);
            assert.deepEqual(result.args, calls[0][1]);
            assert.equal(stdout.text, "ok\n");
            assert.equal(stderr.text, "warn\n");
          });

          test("shared kline sync option mapper preserves retry-facing protocol", () => {
            const args = [];
            appendKlineSyncOptions(args, {
              policy: "proxy-only",
              refreshMode: "full",
              checkpointEvery: "7",
              proxyPreflight: true,
              noProxyPreflight: true,
              proxyMinAvailable: "2",
              proxyMinSuccessRate: "0.8",
              proxyMaxP95Ms: "3000",
              proxyPreflightConcurrency: "4",
              proxyPreflightTimeoutMs: "5000",
              failureQueue: "queue.json",
              limit: "10",
              batchSize: "5",
              offset: "1",
              outputDir: "out",
              force: true,
              concurrency: "auto",
              retryAttempts: "3",
              retryDelayMs: "100",
              retryConcurrency: "2",
              awsRegion: "r1,r2",
              routerRegion: "auto",
              proxyPoolUrl: "http://proxy",
              proxyMaxAttempts: "6",
              huaweicloudRegion: "all",
              huaweicloudRegionStartIndex: "1",
              huaweicloudTargets: "targets.json",
              lambdaName: "kline",
              config: "config.json",
              minSuccessRate: "0.9",
              expectedLatestDate: "20260817",
              freshnessCodes: "fresh.json",
            });
            assert.deepEqual(args, [
              "--policy", "proxy-only", "--refresh-mode", "full", "--checkpoint-every", "7",
              "--proxy-preflight", "--no-proxy-preflight", "--proxy-min-available", "2",
              "--proxy-min-success-rate", "0.8", "--proxy-max-p95-ms", "3000",
              "--proxy-preflight-concurrency", "4", "--proxy-preflight-timeout-ms", "5000",
              "--failure-queue", "queue.json", "--limit", "10", "--batch-size", "5", "--offset", "1",
              "--output-dir", "out", "--force", "--concurrency", "auto", "--retry-attempts", "3",
              "--retry-delay-ms", "100", "--retry-concurrency", "2", "--aws-region", "r1,r2",
              "--router-region", "auto", "--proxy-pool-url", "http://proxy", "--proxy-max-attempts", "6",
              "--huaweicloud-region", "all", "--huaweicloud-region-start-index", "1",
              "--huaweicloud-targets", "targets.json", "--lambda-name", "kline", "--config", "config.json",
              "--min-success-rate", "0.9", "--expected-latest-date", "20260817", "--freshness-codes", "fresh.json",
            ]);
          });

          test("kline sync factory forwards root lazily to runner factory", async () => {
            const roots = [];
            const command = createKlineSyncCommand({
              root: "/repo",
              createNodeScriptRunner({ root }) {
                roots.push(root);
                return async () => ({ stdout: "", stderr: "" });
              },
            });
            await command(["codes.json"]);
            assert.deepEqual(roots, ["/repo"]);
          });

          test("buildKlineSyncArgs supports policy and explicit period", () => {
            assert.deepEqual(
              buildKlineSyncArgs({ _: ["pool"], period: "yearly", policy: "proxy-only" }),
              ["pool", "--period", "yearly", "--policy", "proxy-only"],
            );
          });
          EOF

          cat > tests/cli-kline-sync-integration.test.js <<'EOF'
          "use strict";

          const assert = require("node:assert/strict");
          const fs = require("node:fs/promises");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");
          const test = require("node:test");

          const ROOT = path.resolve(__dirname, "..");
          const BIN = path.join(ROOT, "bin", "x");

          function runCli(args) {
            return spawnSync(process.execPath, [BIN, ...args], { cwd: ROOT, encoding: "utf8" });
          }

          test("real CLI preserves kline sync protocol errors without launching sync script", () => {
            for (const { args, error } of [
              { args: ["kline", "sync"], error: "kline sync requires <input_dir|codes.json>\n" },
              { args: ["kline", "sync", "codes.json", "--limit"], error: "Missing value for --limit\n" },
              { args: ["kline", "sync", "codes.json", "--policy", "p", "--engine", "aws"], error: "--policy and --engine cannot be used together.\n" },
            ]) {
              const result = runCli(args);
              assert.equal(result.status, 1, args.join(" "));
              assert.equal(result.stdout, "", args.join(" "));
              assert.equal(result.stderr, error, args.join(" "));
            }
          });

          test("bin/x delegates kline sync while retry keeps shared option mapping", async () => {
            const source = await fs.readFile(BIN, "utf8");
            assert.match(source, /createKlineSyncCommand/);
            assert.match(source, /const commandKlineSync = createKlineSyncCommand\(\{ root: ROOT \}\);/);
            assert.match(source, /await commandKlineSync\(rest\);/);
            assert.doesNotMatch(source, /async function commandKlineSync\(/);
            assert.doesNotMatch(source, /function appendKlineSyncOptions\(/);
            assert.match(source, /appendKlineSyncOptions\(args, \{/);
            assert.match(source, /async function commandKlineRetry\(/);
          });
          EOF

          node <<'NODE'
          const fs = require('node:fs');
          const file = 'bin/x';
          let source = fs.readFileSync(file, 'utf8');
          const importAnchor = 'const { createCodesBuildCommand } = require("../src/adapters/cli/commands/codes_build");\n';
          const importLine = 'const { appendKlineSyncOptions, createKlineSyncCommand } = require("../src/adapters/cli/commands/kline_sync");\n';
          if (!source.includes(importAnchor)) throw new Error('missing codes build import anchor');
          source = source.replace(importAnchor, importAnchor + importLine);

          const compositionAnchor = 'const commandCodesBuild = createCodesBuildCommand({ root: ROOT });\n';
          const compositionLine = 'const commandKlineSync = createKlineSyncCommand({ root: ROOT });\n';
          if (!source.includes(compositionAnchor)) throw new Error('missing codes build composition anchor');
          source = source.replace(compositionAnchor, compositionAnchor + compositionLine);

          const start = source.indexOf('function appendKlineSyncOptions(');
          const end = source.indexOf('async function loadCodesInput(', start);
          if (start < 0 || end < 0) throw new Error('missing kline sync extraction anchors');
          source = source.slice(0, start) + source.slice(end);
          fs.writeFileSync(file, source);
          NODE

          node --check bin/x
          node --check src/adapters/cli/commands/kline_sync.js
          node --test tests/cli-kline-sync-command.test.js tests/cli-kline-sync-integration.test.js tests/cli-codes-build-command.test.js tests/cli-codes-build-integration.test.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x src/adapters/cli/commands/kline_sync.js tests/cli-kline-sync-command.test.js tests/cli-kline-sync-integration.test.js
          git commit -m "refactor: separate kline sync from CLI entry"
          git push origin HEAD:refactor/cli-kline-sync-boundary
