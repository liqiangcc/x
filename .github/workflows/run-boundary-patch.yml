name: Run Boundary Patch

on:
  push:
    paths:
      - .github/workflows/run-boundary-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/cli-run-boundary

      - name: Patch run delegation only
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("bin/x")
          text = path.read_text()

          import_anchor = 'const { createDoctorCommand } = require("../src/adapters/cli/commands/doctor");\n'
          import_line = 'const { createRunCommand } = require("../src/adapters/cli/commands/run");\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("run import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          runs_anchor = 'const DEFAULT_RUNS_DIR = path.join(ROOT, "runs");\n'
          binding_line = 'const commandRun = createRunCommand({ runsDir: DEFAULT_RUNS_DIR });\n'
          if binding_line not in text:
              if runs_anchor not in text:
                  raise SystemExit("DEFAULT_RUNS_DIR anchor not found")
              text = text.replace(runs_anchor, runs_anchor + binding_line, 1)

          legacy = textwrap.dedent('''
          async function commandRun(argv) {
            const subcommand = argv[0];
            if (subcommand === "list") {
              const entries = await fs.readdir(DEFAULT_RUNS_DIR, { withFileTypes: true }).catch(() => []);
              for (const entry of entries.filter((item) => item.isDirectory()).map((item) => item.name).sort()) {
                console.log(entry);
              }
              return;
            }

            const runId = argv[1];
            if (!runId) {
              throw new Error(`run ${subcommand ?? ""} requires <run_id>`);
            }

            const fileName = subcommand === "failures" ? "failures.json" : "run.json";
            const filePath = path.join(DEFAULT_RUNS_DIR, runId, fileName);
            process.stdout.write(await fs.readFile(filePath, "utf8"));
          }

          ''')
          if legacy in text:
              text = text.replace(legacy, "", 1)
          elif "async function commandRun(" in text:
              raise SystemExit("legacy run function shape changed; refusing broad patch")

          path.write_text(text)
          PY

      - name: Verify scoped diff
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "bin/x"
          grep -q 'createRunCommand' bin/x
          grep -q 'const commandRun = createRunCommand' bin/x
          ! grep -q 'async function commandRun' bin/x
          node --check bin/x

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/x
          git commit -m 'refactor(run): delegate CLI command through adapter'
          git push origin HEAD:refactor/cli-run-boundary
