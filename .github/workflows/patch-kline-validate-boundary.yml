name: Patch Kline Validate Boundary

on:
  push:
    branches:
      - refactor/cli-kline-validate-boundary
    paths:
      - .github/workflows/patch-kline-validate-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-kline-validate-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply scoped validate entry patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          source = path.read_text()

          import_anchor = 'const { createKlineFetchCommand } = require("../src/adapters/cli/commands/kline_fetch");\n'
          import_line = 'const { createKlineValidateCommand } = require("../src/adapters/cli/commands/kline_validate");\n'
          assert source.count(import_anchor) == 1
          assert import_line not in source
          source = source.replace(import_anchor, import_anchor + import_line, 1)

          composition_anchor = 'const commandKlineFetch = createKlineFetchCommand({ root: ROOT });\n'
          composition_line = 'const commandKlineValidate = createKlineValidateCommand({ root: ROOT });\n'
          assert source.count(composition_anchor) == 1
          assert composition_line not in source
          source = source.replace(composition_anchor, composition_anchor + composition_line, 1)

          start = source.index('async function commandKlineValidate(argv) {')
          end = source.index('async function commandKlineFreshness(', start)
          assert start >= 0 and end > start
          source = source[:start] + source[end:]

          assert 'async function commandKlineValidate(' not in source
          assert 'runNodeAllowFailure("fetch/check_kline_empty.js", args)' not in source
          assert 'async function commandKlineFreshness(' in source
          assert 'async function commandKlineRetryQueue(' in source
          assert 'async function commandDaily(' in source
          path.write_text(source)
          PY

          node --check bin/x
          node --check src/adapters/cli/commands/kline_validate.js
          node --check src/adapters/system/node_script_runner.js
          node --check src/adapters/kline/kline_sync_retry_runner.js
          node --test \
            tests/node-script-runner.test.js \
            tests/node-script-runner-allow-failure.test.js \
            tests/kline-sync-retry-runner.test.js \
            tests/cli-kline-validate-command.test.js \
            tests/cli-kline-validate-integration.test.js \
            tests/cli-kline-fetch-integration.test.js \
            tests/cli-kline-retry-integration.test.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 0
          git commit -m "refactor: separate kline validate from CLI entry"
          git push origin HEAD:refactor/cli-kline-validate-boundary
