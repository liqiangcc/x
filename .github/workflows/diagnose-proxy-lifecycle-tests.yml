name: Diagnose proxy lifecycle unit tests

on:
  push:
    branches:
      - refactor/cli-proxy-lifecycle-boundary
    paths:
      - .github/workflows/diagnose-proxy-lifecycle-tests.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-proxy-lifecycle-boundary
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Capture exact unit test output
        run: |
          set +e
          mkdir -p .diagnostics
          npm test > .diagnostics/proxy-lifecycle-unit-tests.txt 2>&1
          test_exit=$?
          echo "TEST_EXIT=$test_exit" >> "$GITHUB_ENV"
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .diagnostics/proxy-lifecycle-unit-tests.txt
          git commit -m "chore: capture proxy lifecycle unit test diagnostics"
          git push origin HEAD:refactor/cli-proxy-lifecycle-boundary
      - name: Preserve test result
        run: exit "${TEST_EXIT:-1}"
