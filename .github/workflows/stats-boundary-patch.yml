name: Stats Boundary Patch

on:
  push:
    paths:
      - .github/workflows/stats-boundary-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/cli-stats-boundary

      - name: Patch stats delegation only
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("bin/x")
          text = path.read_text()

          import_anchor = 'const { createDbCommand } = require("../src/adapters/cli/commands/db");\n'
          import_line = 'const { createStatsCommand } = require("../src/adapters/cli/commands/stats");\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("stats import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          binding_anchor = 'const commandDb = createDbCommand();\n'
          binding_line = 'const commandStats = createStatsCommand();\n'
          if binding_line not in text:
              if binding_anchor not in text:
                  raise SystemExit("stats binding anchor not found")
              text = text.replace(binding_anchor, binding_anchor + binding_line, 1)

          legacy = textwrap.dedent('''
          async function commandStats(argv) {
            const subcommand = argv[0];
            const options = parseOptions(argv.slice(1), { db: "mydb.db" });
            const { analyzeNewHighs, yearlyPositivePct } = require("./../src/stats/statistics");

            if (subcommand === "yearly-positive") {
              if (!options.metricColumn) {
                throw new Error("stats yearly-positive requires --metric-column <column>");
              }
              printJson(yearlyPositivePct({
                dbFile: options.db,
                metricColumn: options.metricColumn,
                stockCode: options.stockCode ?? null,
              }));
              return;
            }

            if (subcommand === "new-highs") {
              printJson(analyzeNewHighs({
                dbFile: options.db,
                year: options.year ?? null,
                date: options.date ?? null,
              }));
              return;
            }

            throw new Error(`Unknown stats command: ${subcommand ?? ""}`);
          }

          ''')
          if legacy in text:
              text = text.replace(legacy, "", 1)
          elif "async function commandStats(" in text:
              raise SystemExit("legacy stats function shape changed; refusing broad patch")

          path.write_text(text)
          PY

      - name: Verify scoped diff
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "bin/x"
          grep -q 'createStatsCommand' bin/x
          grep -q 'const commandStats = createStatsCommand' bin/x
          ! grep -q 'async function commandStats' bin/x
          node --check bin/x

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/x
          git commit -m 'refactor(stats): delegate CLI command through adapter'
          git push origin HEAD:refactor/cli-stats-boundary
