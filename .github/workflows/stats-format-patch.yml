name: Stats Format Patch

on:
  push:
    paths:
      - .github/workflows/stats-format-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bin only
        uses: actions/checkout@v4
        with:
          ref: refactor/cli-stats-boundary
          filter: blob:none
          sparse-checkout: bin/x
          sparse-checkout-cone-mode: false

      - name: Restore function separation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          text = path.read_text()
          broken = '}async function commandProxy(argv) {'
          fixed = '}\n\nasync function commandProxy(argv) {'
          count = text.count(broken)
          if count == 1:
              text = text.replace(broken, fixed, 1)
          elif count != 0:
              raise SystemExit(f"unexpected broken boundary count: {count}")
          path.write_text(text)
          PY

      - name: Verify scoped result
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            test "$changed" = "bin/x"
          fi
          ! grep -q '}async function commandProxy' bin/x
          grep -q '^async function commandProxy' bin/x
          node --check bin/x

      - name: Commit patch if needed
        run: |
          git add bin/x
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(stats): preserve CLI function boundary'
          git push origin HEAD:refactor/cli-stats-boundary
