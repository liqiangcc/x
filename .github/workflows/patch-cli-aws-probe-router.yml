name: Patch AWS probe-router CLI entry

on:
  push:
    branches:
      - refactor/cli-aws-probe-router-boundary
    paths:
      - .github/workflows/patch-cli-aws-probe-router.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-aws-probe-router-boundary
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            bin/x
      - name: Patch bin/x
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bin/x")
          text = path.read_text()

          import_anchor = 'const { createBenchmarkCommand } = require("../src/adapters/cli/commands/benchmark");\n'
          import_line = 'const { createAwsProbeRouterCommand } = require("../src/adapters/cli/commands/aws_probe_router");\n'
          assert text.count(import_anchor) == 1
          assert import_line not in text
          text = text.replace(import_anchor, import_anchor + import_line, 1)

          binding_anchor = 'const commandBenchmark = createBenchmarkCommand({ root: ROOT, runsDir: DEFAULT_RUNS_DIR });\n'
          binding_line = 'const commandAwsProbeRouter = createAwsProbeRouterCommand();\n'
          assert text.count(binding_anchor) == 1
          assert binding_line not in text
          text = text.replace(binding_anchor, binding_anchor + binding_line, 1)

          for name in ["periodToKlt", "requiredEnv", "appendUrlPath"]:
            pattern = re.compile(rf'\nfunction {name}\([^\n]*\) \{{.*?\n\}}\n', re.S)
            text, count = pattern.subn('\n', text, count=1)
            assert count == 1, (name, count)

          for name in ["postRouterJson", "commandAwsProbeRouter"]:
            pattern = re.compile(rf'\nasync function {name}\([^\n]*\) \{{.*?\n\}}\n', re.S)
            text, count = pattern.subn('\n', text, count=1)
            assert count == 1, (name, count)

          old_start = '''async function commandAws(argv) {
            const subcommand = argv[0];
            const options = parseOptions(argv.slice(1));
          '''
          new_start = '''async function commandAws(argv) {
            const subcommand = argv[0];
            if (subcommand === "probe-router") {
              await commandAwsProbeRouter(argv.slice(1));
              return;
            }
            const options = parseOptions(argv.slice(1));
          '''
          assert text.count(old_start) == 1
          text = text.replace(old_start, new_start, 1)

          old_probe_branch = '''
            if (subcommand === "probe-router") {
              await commandAwsProbeRouter(options);
              return;
            }
          '''
          assert text.count(old_probe_branch) == 1
          text = text.replace(old_probe_branch, '\n', 1)

          infer_import = 'const { inferSecid } = require("../src/core/secid");\n'
          if text.count("inferSecid") == 1:
            assert text.count(infer_import) == 1
            text = text.replace(infer_import, "", 1)

          assert 'async function commandAwsProbeRouter(' not in text
          assert 'async function postRouterJson(' not in text
          assert 'function periodToKlt(' not in text
          assert 'function requiredEnv(' not in text
          assert 'function appendUrlPath(' not in text
          assert 'await commandAwsProbeRouter(argv.slice(1));' in text
          assert 'await commandAws([subcommand, ...rest]);' in text

          path.write_text(text)
          PY
      - name: Validate patch
        run: |
          node --check bin/x
          git diff --check -- bin/x
          git diff -- bin/x
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 1
          git commit -m "refactor(aws): delegate probe-router CLI entry"
          git push origin HEAD:refactor/cli-aws-probe-router-boundary
