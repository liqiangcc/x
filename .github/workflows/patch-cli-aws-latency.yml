name: Patch AWS latency CLI entry

on:
  push:
    branches:
      - refactor/cli-aws-latency-boundary
    paths:
      - .github/workflows/patch-cli-aws-latency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-aws-latency-boundary
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            bin/x
      - name: Patch bin/x
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bin/x")
          text = path.read_text()

          import_anchor = 'const { createAwsMaintenanceCommand } = require("../src/adapters/cli/commands/aws_maintenance");\n'
          import_line = 'const { createAwsLatencyCommand } = require("../src/adapters/cli/commands/aws_latency");\n'
          assert text.count(import_anchor) == 1
          assert import_line not in text
          text = text.replace(import_anchor, import_anchor + import_line, 1)

          binding_anchor = 'const commandAwsMaintenance = createAwsMaintenanceCommand({ root: ROOT });\n'
          binding_line = 'const commandAwsLatency = createAwsLatencyCommand({ root: ROOT });\n'
          assert text.count(binding_anchor) == 1
          assert binding_line not in text
          text = text.replace(binding_anchor, binding_anchor + binding_line, 1)

          old_latency_import = '''const {
            formatLatencyReport,
            normalizeLatencyOptions,
            runLatencyBenchmark,
          } = require("../src/aws/latency");
          '''
          new_latency_import = '''const {
            normalizeLatencyOptions,
            runLatencyBenchmark,
          } = require("../src/aws/latency");
          '''
          assert text.count(old_latency_import) == 1
          text = text.replace(old_latency_import, new_latency_import, 1)

          pattern = re.compile(r'\nasync function commandAwsLatency\([^\n]*\) \{.*?\n\}\n', re.S)
          text, count = pattern.subn('\n', text, count=1)
          assert count == 1, count

          maintenance_anchor = '''  if (["status", "sync-github-secrets"].includes(subcommand)) {
            await commandAwsMaintenance(argv);
            return;
          }
          '''
          latency_branch = '''  if (subcommand === "latency") {
            await commandAwsLatency(argv.slice(1));
            return;
          }
          '''
          assert text.count(maintenance_anchor) == 1
          assert latency_branch not in text
          text = text.replace(maintenance_anchor, maintenance_anchor + latency_branch, 1)

          parse_line = '  const options = parseOptions(argv.slice(1));\n'
          assert text.count(parse_line) == 1
          text = text.replace(parse_line, '  parseOptions(argv.slice(1));\n', 1)

          old_latency_branch = '''  if (subcommand === "latency") {
            await commandAwsLatency(options);
            return;
          }
          '''
          assert text.count(old_latency_branch) == 1
          text = text.replace(old_latency_branch, '', 1)

          assert 'async function commandAwsLatency(' not in text
          assert 'formatLatencyReport' not in text
          assert 'await commandAwsLatency(argv.slice(1));' in text
          assert text.count('runLatencyBenchmark(normalizeLatencyOptions(rawLatencyOptions, config))') == 1
          assert 'await commandAwsProbeRouter(argv.slice(1));' in text
          assert 'await commandAwsMaintenance(argv);' in text

          path.write_text(text)
          PY
      - name: Validate patch
        run: |
          node --check bin/x
          git diff --check -- bin/x
          git diff -- bin/x
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 1
          git commit -m "refactor(aws): delegate latency CLI entry"
          git push origin HEAD:refactor/cli-aws-latency-boundary
