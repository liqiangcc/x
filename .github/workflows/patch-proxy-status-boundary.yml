name: Patch proxy status CLI entry

on:
  push:
    branches:
      - refactor/cli-proxy-status-boundary
    paths:
      - .github/workflows/patch-proxy-status-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-proxy-status-boundary
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch bin/x
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          text = path.read_text()

          old = 'const { createProxyPoolSelectCommand } = require("../src/adapters/cli/commands/proxy_pool_select");\n'
          new = old + 'const { createProxyPoolStatusCommand } = require("../src/adapters/cli/commands/proxy_pool_status");\n'
          assert text.count(old) == 1, "proxy select import anchor changed"
          assert "createProxyPoolStatusCommand" not in text, "proxy status import already present"
          text = text.replace(old, new, 1)

          old = 'const commandProxyPoolSelect = createProxyPoolSelectCommand({ root: ROOT });\n'
          new = old + 'const commandProxyPoolStatus = createProxyPoolStatusCommand({ root: ROOT });\n'
          assert text.count(old) == 1, "proxy select binding anchor changed"
          assert "const commandProxyPoolStatus" not in text, "proxy status binding already present"
          text = text.replace(old, new, 1)

          legacy = '''  if (action === "status") {
            await proxyCompose(["ps"]);
            const { fetchAllProxyCandidates } = require("./../src/proxy/pool");
            try {
              const candidates = await fetchAllProxyCandidates();
              printJson({ ok: true, cn_candidates: candidates.length });
            } catch (error) {
              printJson({ ok: false, error: error.message, cn_candidates: 0 });
              process.exitCode = 1;
            }
            return;
          }

          '''.replace("          ", "")
          assert text.count(legacy) == 1, "legacy proxy status block changed"
          text = text.replace(legacy, "", 1)

          old = '''  if (action === "select") {
            await commandProxyPoolSelect(argv.slice(1));
            return;
          }
          const options = parseOptions(argv.slice(1));'''.replace("          ", "")
          new = '''  if (action === "select") {
            await commandProxyPoolSelect(argv.slice(1));
            return;
          }
          if (action === "status") {
            await commandProxyPoolStatus(argv.slice(1));
            return;
          }
          const options = parseOptions(argv.slice(1));'''.replace("          ", "")
          assert text.count(old) == 1, "commandProxyPool routing anchor changed"
          text = text.replace(old, new, 1)

          assert 'await commandProxyPoolStatus(argv.slice(1));' in text
          assert 'await proxyCompose(["ps"]);' not in text
          assert "fetchAllProxyCandidates" not in text
          assert text.count("createProxyPoolStatusCommand") == 2
          assert 'if (action === "up")' in text
          assert 'if (action === "down")' in text
          assert 'if (action === "refresh-github")' in text
          assert 'if (action === "diagnose")' in text
          assert 'if (action === "probe")' in text
          assert 'if (action === "benchmark")' in text
          assert 'if (action === "warmup")' in text

          path.write_text(text)
          PY
      - name: Validate patch
        run: |
          node --check bin/x
          node --test tests/application-proxy-status.test.js tests/proxy-status-adapters.test.js tests/cli-proxy-pool-status-command.test.js
          git diff --check
          git diff -- bin/x
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git commit -m "refactor: route proxy pool status through CLI adapter"
          git push origin HEAD:refactor/cli-proxy-status-boundary
