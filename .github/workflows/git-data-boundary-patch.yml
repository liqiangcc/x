name: git-data-boundary-patch

on:
  push:
    branches:
      - refactor/cli-git-data-boundary
    paths:
      - .github/workflows/git-data-boundary-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: bin/x
          sparse-checkout-cone-mode: false

      - name: Patch git data CLI boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          text = path.read_text()

          import_anchor = 'const { createSimulatorCommand } = require("../src/adapters/cli/commands/simulator");\n'
          import_line = 'const { createGitDataCli } = require("../src/adapters/cli/commands/git");\n'
          if import_line not in text:
              assert text.count(import_anchor) == 1, "git CLI import anchor drifted"
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          for old_import in [
              'const { dataCommitMessage } = require("../src/core/data_commit");\n',
              'const { dataCommitPathspecs } = require("../src/core/data_paths");\n',
              'const { existingPathspecs, stagedFiles } = require("../src/core/git");\n',
          ]:
              assert text.count(old_import) == 1, f"expected legacy import once: {old_import!r}"
              text = text.replace(old_import, "", 1)

          binding_anchor = 'const commandRun = createRunCommand({ runsDir: DEFAULT_RUNS_DIR });\n'
          binding = '''const gitDataCli = createGitDataCli({ root: ROOT, runsDir: DEFAULT_RUNS_DIR });
          const commandGit = gitDataCli.command;
          const commitData = gitDataCli.commitData;
          '''
          if binding not in text:
              assert text.count(binding_anchor) == 1, "git data binding anchor drifted"
              text = text.replace(binding_anchor, binding_anchor + binding, 1)

          legacy_pathspec = '''\nasync function existingDataPathspecs(candidates = ["data", "runs", "reports"]) {
            return existingPathspecs(ROOT, candidates);
          }
          '''
          assert text.count(legacy_pathspec) == 1, "legacy existingDataPathspecs block drifted"
          text = text.replace(legacy_pathspec, "\n", 1)

          start_marker = '\nasync function commitData(runId) {'
          end_marker = '\n\nasync function main() {'
          assert text.count(start_marker) == 1, "legacy commitData block drifted"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          legacy_block = text[start:end]
          assert 'async function commandGit(argv)' in legacy_block, "legacy commandGit missing from removal block"
          text = text[:start] + '\n' + text[end:]

          assert text.count(import_line) == 1, "git CLI import must appear exactly once"
          assert text.count('const gitDataCli = createGitDataCli({ root: ROOT, runsDir: DEFAULT_RUNS_DIR });') == 1
          assert text.count('const commandGit = gitDataCli.command;') == 1
          assert text.count('const commitData = gitDataCli.commitData;') == 1
          assert 'async function existingDataPathspecs' not in text
          assert 'async function commitData(runId)' not in text
          assert 'async function commandGit(argv)' not in text
          assert 'dataCommitMessage' not in text
          assert 'dataCommitPathspecs' not in text
          assert 'existingPathspecs' not in text
          assert 'stagedFiles' not in text
          assert text.count('() => commitData(runId)') == 1, "daily --commit integration changed"

          path.write_text(text)
          PY

          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "bin/x" ]; then
            echo "unexpected changed files: $changed" >&2
            exit 1
          fi
          node --check bin/x

      - name: Commit exact patch
        shell: bash
        run: |
          if git diff --quiet -- bin/x; then
            echo "bin/x already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git commit -m "refactor(git): delegate data commands through adapter"
          git push origin HEAD:refactor/cli-git-data-boundary
