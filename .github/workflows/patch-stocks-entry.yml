name: Patch stocks entry boundary

# Re-run after advancing the previous pool-pull boundary expectation.
on:
  push:
    branches:
      - refactor/cli-stocks-fetch-boundary
    paths:
      - .github/workflows/patch-stocks-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/cli-stocks-fetch-boundary
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Patch bin/x
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          source = path.read_text()

          import_anchor = 'const { createPoolPullCommand } = require("../src/adapters/cli/commands/pool_pull");\n'
          import_replacement = import_anchor + 'const { createStocksCommand } = require("../src/adapters/cli/commands/stocks");\n'
          assert source.count(import_anchor) == 1
          source = source.replace(import_anchor, import_replacement, 1)

          binding_anchor = 'const DEFAULT_UNIVERSE_DIR = path.join(ROOT, "data", "universe");\n'
          binding_replacement = binding_anchor + 'const commandStocks = createStocksCommand({ root: ROOT, outputDir: rel(DEFAULT_UNIVERSE_DIR) });\n'
          assert source.count(binding_anchor) == 1
          source = source.replace(binding_anchor, binding_replacement, 1)

          start = source.index('async function commandStocks(argv) {')
          end = source.index('async function commandCodesBuild(argv) {', start)
          source = source[:start] + source[end:]

          assert source.count('createStocksCommand') == 2
          assert 'const commandStocks = createStocksCommand({ root: ROOT, outputDir: rel(DEFAULT_UNIVERSE_DIR) });' in source
          assert 'async function commandStocks(' not in source
          assert 'runNode("fetch/fetch_market_stocks.js", args)' not in source
          assert 'runNodeAllowFailure("fetch/fetch_market_stocks.js", [' in source
          assert 'async function commandCodesBuild(' in source
          assert 'await commandStocks([subcommand, ...rest]);' in source

          path.write_text(source)
          PY

      - name: Validate patch
        run: |
          node --check bin/x
          node --check src/adapters/cli/commands/stocks.js
          node --test \
            tests/node-script-runner.test.js \
            tests/cli-stocks-command.test.js \
            tests/cli-stocks-integration.test.js \
            tests/cli-pool-pull-command.test.js \
            tests/cli-pool-pull-integration.test.js \
            tests/cli-bin-x-boundary-audit.test.js
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+liqiangcc@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate stocks fetch from CLI entry"
          git push origin HEAD:refactor/cli-stocks-fetch-boundary
