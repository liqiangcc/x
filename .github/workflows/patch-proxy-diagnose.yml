name: Patch proxy diagnose entry boundary

on:
  push:
    branches:
      - refactor/cli-proxy-diagnose-boundary
    paths:
      - .github/workflows/patch-proxy-diagnose.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/cli-proxy-diagnose-boundary
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Patch bin/x
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          source = path.read_text()

          import_anchor = 'const { createProxyPoolLifecycleCommand } = require("../src/adapters/cli/commands/proxy_pool_lifecycle");\n'
          import_replacement = import_anchor + 'const { createProxyPoolDiagnoseCommand } = require("../src/adapters/cli/commands/proxy_pool_diagnose");\nconst { createFilesystemProxyBenchmarkReportWriter } = require("../src/adapters/proxy/filesystem_proxy_benchmark_reports");\n'
          assert source.count(import_anchor) == 1
          source = source.replace(import_anchor, import_replacement, 1)

          runs_anchor = 'const DEFAULT_RUNS_DIR = path.join(ROOT, "runs");\nconst commandRun = createRunCommand({ runsDir: DEFAULT_RUNS_DIR });\n'
          runs_replacement = 'const DEFAULT_RUNS_DIR = path.join(ROOT, "runs");\nconst proxyBenchmarkReportWriter = createFilesystemProxyBenchmarkReportWriter({ root: ROOT, runsDir: DEFAULT_RUNS_DIR });\nconst commandRun = createRunCommand({ runsDir: DEFAULT_RUNS_DIR });\n'
          assert source.count(runs_anchor) == 1
          source = source.replace(runs_anchor, runs_replacement, 1)

          binding_anchor = 'const commandProxyPoolLifecycle = createProxyPoolLifecycleCommand({ root: ROOT });\nconst commandDb = createDbCommand();\n'
          binding_replacement = 'const commandProxyPoolLifecycle = createProxyPoolLifecycleCommand({ root: ROOT });\nconst commandProxyPoolDiagnose = createProxyPoolDiagnoseCommand({\n  root: ROOT,\n  runsDir: DEFAULT_RUNS_DIR,\n  reportWriter: proxyBenchmarkReportWriter,\n});\nconst commandDb = createDbCommand();\n'
          assert source.count(binding_anchor) == 1
          source = source.replace(binding_anchor, binding_replacement, 1)

          helper_start = source.index('async function writeProxyBenchmarkReport(report, kind) {')
          helper_end = source.index('async function commandProxyPool(argv) {', helper_start)
          source = source[:helper_start] + source[helper_end:]

          route_anchor = '  if (["up", "down"].includes(action)) {\n    await commandProxyPoolLifecycle(argv);\n    return;\n  }\n  const options = parseOptions(argv.slice(1));\n'
          route_replacement = '  if (["up", "down"].includes(action)) {\n    await commandProxyPoolLifecycle(argv);\n    return;\n  }\n  if (action === "diagnose") {\n    await commandProxyPoolDiagnose(argv.slice(1));\n    return;\n  }\n  const options = parseOptions(argv.slice(1));\n'
          assert source.count(route_anchor) == 1
          source = source.replace(route_anchor, route_replacement, 1)

          legacy_start_text = '  if (action === "diagnose") {\n    const { classifyProxyError, cooldownMs, DEFAULT_STATE_FILE } = require("./../src/proxy/pool");'
          legacy_start = source.index(legacy_start_text)
          legacy_end = source.index('  if (action === "probe") {', legacy_start)
          source = source[:legacy_start] + source[legacy_end:]

          replacements = {
            'await writeProxyBenchmarkReport(report, "probe")': 'await proxyBenchmarkReportWriter.write(report, "probe")',
            'await writeProxyBenchmarkReport(report, "benchmark")': 'await proxyBenchmarkReportWriter.write(report, "benchmark")',
            'await writeProxyBenchmarkReport(report, "warmup")': 'await proxyBenchmarkReportWriter.write(report, "warmup")',
          }
          for old, new in replacements.items():
            assert source.count(old) == 1, (old, source.count(old))
            source = source.replace(old, new, 1)

          assert 'async function writeProxyBenchmarkReport' not in source
          assert 'await commandProxyPoolDiagnose(argv.slice(1));' in source
          assert source.count('proxyBenchmarkReportWriter.write(report,') == 3
          assert 'report.target = "eastmoney-kline"' not in source
          assert 'if (action === "probe")' in source
          assert 'if (action === "benchmark")' in source
          assert 'if (action === "warmup")' in source

          path.write_text(source)
          PY

      - name: Validate patch
        run: |
          node --check bin/x
          node --test \
            tests/application-proxy-diagnostics.test.js \
            tests/proxy-diagnostic-adapters.test.js \
            tests/cli-proxy-pool-diagnose-command.test.js \
            tests/cli-proxy-pool-diagnose-integration.test.js \
            tests/cli-proxy-pool-lifecycle-integration.test.js \
            tests/cli-proxy-pool-refresh-github-integration.test.js
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate proxy pool diagnose from CLI"
          git push origin HEAD:refactor/cli-proxy-diagnose-boundary
