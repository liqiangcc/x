name: Patch Kline Aggregate Yearly Boundary

on:
  push:
    branches:
      - refactor/cli-kline-aggregate-yearly-boundary
    paths:
      - .github/workflows/patch-kline-aggregate-yearly-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-kline-aggregate-yearly-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply scoped aggregate yearly entry patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          source = path.read_text()

          import_anchor = 'const { createKlineSyncControlCommand } = require("../src/adapters/cli/commands/kline_sync_control");\n'
          import_line = 'const { createKlineAggregateYearlyCommand } = require("../src/adapters/cli/commands/kline_aggregate_yearly");\n'
          assert source.count(import_anchor) == 1
          assert import_line not in source
          source = source.replace(import_anchor, import_anchor + import_line, 1)

          direct_capability = 'const { aggregateYearlyFromDaily } = require("../src/kline/aggregate_yearly");\n'
          assert source.count(direct_capability) == 1
          source = source.replace(direct_capability, '', 1)

          composition_anchor = 'const commandKlineSyncControl = createKlineSyncControlCommand();\n'
          composition_line = 'const commandKlineAggregateYearly = createKlineAggregateYearlyCommand({ root: ROOT, klineRoot: DEFAULT_KLINE_DIR });\n'
          assert source.count(composition_anchor) == 1
          assert composition_line not in source
          source = source.replace(composition_anchor, composition_anchor + composition_line, 1)

          assert source.count('loadCodesInput(') == 2
          start = source.index('async function loadCodesInput(inputPath) {')
          end = source.index('async function commandKlineRetryQueue(', start)
          assert start >= 0 and end > start
          source = source[:start] + source[end:]

          assert 'async function loadCodesInput(' not in source
          assert 'async function commandKlineAggregateYearly(' not in source
          assert 'aggregateYearlyFromDaily' not in source
          assert 'await commandKlineAggregateYearly(rest);' in source
          assert 'async function loadCodesJson(' in source
          assert 'async function commandKlineRetryQueue(' in source
          assert 'async function commandKlineFreshness(' in source
          assert 'async function commandDaily(' in source
          path.write_text(source)
          PY

          node --check bin/x
          node --check src/adapters/kline/kline_codes_input_reader.js
          node --check src/adapters/cli/commands/kline_aggregate_yearly.js
          node --test \
            tests/kline-codes-input-reader.test.js \
            tests/cli-kline-aggregate-yearly-command.test.js \
            tests/cli-kline-aggregate-yearly-integration.test.js \
            tests/cli-kline-sync-control-integration.test.js \
            tests/cli-kline-validate-integration.test.js \
            tests/cli-kline-retry-integration.test.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 0
          git commit -m "refactor: separate kline aggregate yearly from CLI entry"
          git push origin HEAD:refactor/cli-kline-aggregate-yearly-boundary
