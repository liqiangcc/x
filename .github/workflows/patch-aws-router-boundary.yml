name: Patch AWS router boundary

on:
  push:
    branches:
      - refactor/cli-aws-router-boundary
    paths:
      - .github/workflows/patch-aws-router-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-aws-router-boundary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply AWS router boundary
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          bin_path = root / 'bin/x'
          source = bin_path.read_text()

          import_anchor = 'const { createAwsProbeRouterCommand } = require("../src/adapters/cli/commands/aws_probe_router");\n'
          router_import = 'const { createAwsCommand } = require("../src/adapters/cli/commands/aws");\n'
          if router_import not in source:
              if import_anchor not in source:
                  raise SystemExit('AWS import anchor not found')
              source = source.replace(import_anchor, router_import + import_anchor, 1)

          composition_anchor = (
              'const commandAwsProbeRouter = createAwsProbeRouterCommand();\n'
              'const commandAwsMaintenance = createAwsMaintenanceCommand({ root: ROOT });\n'
              'const commandAwsLatency = createAwsLatencyCommand({ root: ROOT });\n'
          )
          composition = composition_anchor + (
              'const commandAws = createAwsCommand({\n'
              '  probeRouterCommand: commandAwsProbeRouter,\n'
              '  maintenanceCommand: commandAwsMaintenance,\n'
              '  latencyCommand: commandAwsLatency,\n'
              '});\n'
          )
          if 'const commandAws = createAwsCommand({' not in source:
              if composition_anchor not in source:
                  raise SystemExit('AWS composition anchor not found')
              source = source.replace(composition_anchor, composition, 1)

          pattern = re.compile(
              r'\nasync function commandAws\(argv\) \{.*?\n\}\n\n(?=function extractKlineFailures)',
              re.S,
          )
          source, count = pattern.subn('\n', source, count=1)
          if count != 1:
              raise SystemExit(f'expected one inline commandAws block, found {count}')
          bin_path.write_text(source)

          test_updates = {
              'tests/cli-aws-probe-router-integration.test.js': [
                  (
                      '  assert.match(source, /await commandAwsProbeRouter\\(argv\\.slice\\(1\\)\\)/);\n',
                      '  assert.match(source, /createAwsCommand/);\n'
                      '  assert.match(source, /probeRouterCommand: commandAwsProbeRouter/);\n'
                      '  assert.doesNotMatch(source, /async function commandAws\\(/);\n'
                  ),
              ],
              'tests/cli-aws-maintenance-integration.test.js': [
                  (
                      '  assert.equal(source.includes("await commandAwsMaintenance(argv);"), true);\n',
                      '  assert.equal(source.includes("createAwsCommand"), true);\n'
                      '  assert.equal(source.includes("maintenanceCommand: commandAwsMaintenance"), true);\n'
                  ),
                  (
                      '  assert.equal(source.includes("await commandAwsLatency(argv.slice(1));"), true);\n'
                      '  assert.equal(source.includes("await commandAwsProbeRouter(argv.slice(1));"), true);\n',
                      '  assert.equal(source.includes("latencyCommand: commandAwsLatency"), true);\n'
                      '  assert.equal(source.includes("probeRouterCommand: commandAwsProbeRouter"), true);\n'
                      '  assert.equal(source.includes("async function commandAws("), false);\n'
                  ),
              ],
              'tests/cli-aws-latency-integration.test.js': [
                  (
                      '  assert.match(source, /await commandAwsLatency\\(argv\\.slice\\(1\\)\\);/);\n',
                      '  assert.match(source, /createAwsCommand/);\n'
                      '  assert.match(source, /latencyCommand: commandAwsLatency/);\n'
                      '  assert.doesNotMatch(source, /async function commandAws\\(/);\n'
                  ),
              ],
          }

          for relative, replacements in test_updates.items():
              path = root / relative
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'{relative}: expected test anchor not found: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          cat > src/adapters/cli/commands/aws.js <<'EOF'
          "use strict";

          const { parseCliOptions } = require("../option_parser");

          function requireCommand(command, label) {
            if (typeof command !== "function") {
              throw new TypeError(`${label} must be a function.`);
            }
            return command;
          }

          async function runAwsCommand({
            argv = [],
            probeRouterCommand,
            maintenanceCommand,
            latencyCommand,
          } = {}) {
            const subcommand = argv[0];

            if (subcommand === "probe-router") {
              return requireCommand(probeRouterCommand, "probeRouterCommand")(argv.slice(1));
            }

            if (["status", "sync-github-secrets"].includes(subcommand)) {
              return requireCommand(maintenanceCommand, "maintenanceCommand")(argv);
            }

            if (subcommand === "latency") {
              return requireCommand(latencyCommand, "latencyCommand")(argv.slice(1));
            }

            // Preserve the legacy parent-router contract: malformed options fail before
            // the unknown-subcommand error is emitted.
            parseCliOptions(argv.slice(1));
            throw new Error(`Unknown aws command: ${subcommand ?? ""}`);
          }

          function createAwsCommand({
            probeRouterCommand,
            maintenanceCommand,
            latencyCommand,
          } = {}) {
            const resolvedProbeRouterCommand = requireCommand(
              probeRouterCommand,
              "probeRouterCommand"
            );
            const resolvedMaintenanceCommand = requireCommand(
              maintenanceCommand,
              "maintenanceCommand"
            );
            const resolvedLatencyCommand = requireCommand(
              latencyCommand,
              "latencyCommand"
            );

            return (argv = []) => runAwsCommand({
              argv,
              probeRouterCommand: resolvedProbeRouterCommand,
              maintenanceCommand: resolvedMaintenanceCommand,
              latencyCommand: resolvedLatencyCommand,
            });
          }

          module.exports = {
            createAwsCommand,
            runAwsCommand,
          };
          EOF

          cat > tests/cli-aws-command.test.js <<'EOF'
          "use strict";

          const assert = require("node:assert/strict");
          const test = require("node:test");
          const { createAwsCommand } = require("../src/adapters/cli/commands/aws");

          function createCommands(calls) {
            return {
              probeRouterCommand: async (argv) => {
                calls.push(["probe-router", argv]);
                return "probe";
              },
              maintenanceCommand: async (argv) => {
                calls.push(["maintenance", argv]);
                return "maintenance";
              },
              latencyCommand: async (argv) => {
                calls.push(["latency", argv]);
                return "latency";
              },
            };
          }

          test("AWS router delegates probe-router and latency without their subcommand token", async () => {
            const calls = [];
            const command = createAwsCommand(createCommands(calls));

            assert.equal(
              await command(["probe-router", "--secid", "1.600519"]),
              "probe"
            );
            assert.equal(await command(["latency", "--attempts", "2"]), "latency");
            assert.deepEqual(calls, [
              ["probe-router", ["--secid", "1.600519"]],
              ["latency", ["--attempts", "2"]],
            ]);
          });

          test("AWS router preserves the subcommand token for maintenance adapter", async () => {
            const calls = [];
            const command = createAwsCommand(createCommands(calls));

            assert.equal(await command(["status", "--profile", "dev"]), "maintenance");
            assert.equal(
              await command(["sync-github-secrets", "--repo", "owner/repo"]),
              "maintenance"
            );
            assert.deepEqual(calls, [
              ["maintenance", ["status", "--profile", "dev"]],
              ["maintenance", ["sync-github-secrets", "--repo", "owner/repo"]],
            ]);
          });

          test("AWS router validates malformed unknown-command options before unknown error", async () => {
            const command = createAwsCommand(createCommands([]));

            await assert.rejects(
              () => command(["unknown", "--value"]),
              /Missing value for --value/
            );
            await assert.rejects(
              () => command(["unknown", "--json"]),
              /Unknown aws command: unknown/
            );
          });

          test("AWS router preserves the empty unknown-command diagnostic", async () => {
            const command = createAwsCommand(createCommands([]));
            await assert.rejects(() => command([]), /Unknown aws command: $/);
          });
          EOF

          cat > tests/cli-aws-integration.test.js <<'EOF'
          "use strict";

          const assert = require("node:assert/strict");
          const { execFile } = require("node:child_process");
          const fs = require("node:fs/promises");
          const path = require("node:path");
          const test = require("node:test");
          const { promisify } = require("node:util");

          const execFileAsync = promisify(execFile);
          const ROOT = path.resolve(__dirname, "..");
          const BIN = path.join(ROOT, "bin", "x");

          async function runCli(args) {
            try {
              const result = await execFileAsync(process.execPath, [BIN, ...args], { cwd: ROOT });
              return { ...result, exitCode: 0 };
            } catch (error) {
              return {
                exitCode: error.code,
                stdout: error.stdout ?? "",
                stderr: error.stderr ?? "",
              };
            }
          }

          test("real AWS parent router preserves legacy unknown-command validation order", async () => {
            const malformed = await runCli(["aws", "unknown", "--value"]);
            assert.equal(malformed.exitCode, 1);
            assert.equal(malformed.stdout, "");
            assert.equal(malformed.stderr, "Missing value for --value\n");

            const unknown = await runCli(["aws", "unknown"]);
            assert.equal(unknown.exitCode, 1);
            assert.equal(unknown.stdout, "");
            assert.equal(unknown.stderr, "Unknown aws command: unknown\n");
          });

          test("bin/x delegates the AWS family through one parent CLI adapter", async () => {
            const source = await fs.readFile(BIN, "utf8");
            assert.match(source, /createAwsCommand/);
            assert.match(source, /const commandAws = createAwsCommand\(\{/);
            assert.match(source, /probeRouterCommand: commandAwsProbeRouter/);
            assert.match(source, /maintenanceCommand: commandAwsMaintenance/);
            assert.match(source, /latencyCommand: commandAwsLatency/);
            assert.match(source, /await commandAws\(\[subcommand, \.\.\.rest\]\);/);
            assert.doesNotMatch(source, /async function commandAws\(/);
            assert.doesNotMatch(source, /await commandAwsProbeRouter\(/);
            assert.doesNotMatch(source, /await commandAwsMaintenance\(/);
            assert.doesNotMatch(source, /await commandAwsLatency\(/);
          });
          EOF

      - name: Validate targeted AWS boundary
        run: |
          node --check bin/x
          node --check src/adapters/cli/commands/aws.js
          node --test \
            tests/cli-aws-command.test.js \
            tests/cli-aws-integration.test.js \
            tests/cli-aws-probe-router-integration.test.js \
            tests/cli-aws-maintenance-integration.test.js \
            tests/cli-aws-latency-integration.test.js

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x src/adapters/cli/commands/aws.js tests/cli-aws-command.test.js tests/cli-aws-integration.test.js tests/cli-aws-probe-router-integration.test.js tests/cli-aws-maintenance-integration.test.js tests/cli-aws-latency-integration.test.js
          git commit -m "refactor: separate aws router from CLI entry"
          git push origin HEAD:refactor/cli-aws-router-boundary
