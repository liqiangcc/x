name: Patch proxy benchmark entry boundary

on:
  push:
    branches:
      - refactor/cli-proxy-benchmark-boundary
    paths:
      - .github/workflows/patch-proxy-benchmark.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/cli-proxy-benchmark-boundary
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Patch bin/x
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          source = path.read_text()

          import_anchor = 'const { createProxyPoolProbeCommand } = require("../src/adapters/cli/commands/proxy_pool_probe");\n'
          import_replacement = import_anchor + 'const { createProxyPoolBenchmarkCommand } = require("../src/adapters/cli/commands/proxy_pool_benchmark");\n'
          assert source.count(import_anchor) == 1
          source = source.replace(import_anchor, import_replacement, 1)

          binding_anchor = 'const commandProxyPoolProbe = createProxyPoolProbeCommand({\n  root: ROOT,\n  runsDir: DEFAULT_RUNS_DIR,\n  reportWriter: proxyBenchmarkReportWriter,\n});\nconst commandDb = createDbCommand();\n'
          binding_replacement = 'const commandProxyPoolProbe = createProxyPoolProbeCommand({\n  root: ROOT,\n  runsDir: DEFAULT_RUNS_DIR,\n  reportWriter: proxyBenchmarkReportWriter,\n});\nconst commandProxyPoolBenchmark = createProxyPoolBenchmarkCommand({\n  root: ROOT,\n  runsDir: DEFAULT_RUNS_DIR,\n  reportWriter: proxyBenchmarkReportWriter,\n});\nconst commandDb = createDbCommand();\n'
          assert source.count(binding_anchor) == 1
          source = source.replace(binding_anchor, binding_replacement, 1)

          route_anchor = '  if (action === "probe") {\n    await commandProxyPoolProbe(argv.slice(1));\n    return;\n  }\n  const options = parseOptions(argv.slice(1));\n'
          route_replacement = '  if (action === "probe") {\n    await commandProxyPoolProbe(argv.slice(1));\n    return;\n  }\n  if (action === "benchmark") {\n    await commandProxyPoolBenchmark(argv.slice(1));\n    return;\n  }\n  const options = parseOptions(argv.slice(1));\n'
          assert source.count(route_anchor) == 1
          source = source.replace(route_anchor, route_replacement, 1)

          legacy_start = source.index('  if (action === "benchmark") {\n    const report = await runProxyBenchmark({ samples, concurrency });')
          legacy_end = source.index('  if (action === "warmup") {', legacy_start)
          source = source[:legacy_start] + source[legacy_end:]

          assert source.count('createProxyPoolBenchmarkCommand') == 2
          assert 'await commandProxyPoolBenchmark(argv.slice(1));' in source
          assert 'proxyBenchmarkReportWriter.write(report, "benchmark")' not in source
          assert 'const { runProxyBenchmark } = require("./../src/proxy/pool");' in source
          assert 'const samples = parsePositiveOption(options.samples, "--samples", action === "warmup" ? 20 : 100);' in source
          assert 'const concurrency = parsePositiveOption(options.concurrency, "--concurrency", 4);' in source
          assert 'proxyBenchmarkReportWriter.write(report, "warmup")' in source
          assert 'if (action === "warmup")' in source

          path.write_text(source)
          PY

      - name: Validate patch
        run: |
          node --check bin/x
          node --check src/application/proxy/run_proxy_pool_benchmark.js
          node --check src/ports/proxy/proxy_benchmark.js
          node --check src/adapters/proxy/proxy_pool_benchmark_runner.js
          node --check src/adapters/cli/commands/proxy_pool_benchmark.js
          node --test \
            tests/application-proxy-benchmark.test.js \
            tests/proxy-benchmark-adapters.test.js \
            tests/cli-proxy-pool-benchmark-command.test.js \
            tests/cli-proxy-pool-benchmark-integration.test.js \
            tests/cli-proxy-pool-probe-integration.test.js \
            tests/cli-proxy-pool-diagnose-integration.test.js
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate proxy pool benchmark from CLI"
          git push origin HEAD:refactor/cli-proxy-benchmark-boundary
