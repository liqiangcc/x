name: Patch benchmark CLI entry

on:
  push:
    branches:
      - refactor/cli-benchmark-boundary
    paths:
      - .github/workflows/patch-cli-benchmark.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-benchmark-boundary
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            bin/x
      - name: Patch bin/x
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bin/x")
          text = path.read_text()

          import_anchor = 'const { createGitDataCli } = require("../src/adapters/cli/commands/git");\n'
          import_line = 'const { createBenchmarkCommand } = require("../src/adapters/cli/commands/benchmark");\n'
          assert text.count(import_anchor) == 1
          assert import_line not in text
          text = text.replace(import_anchor, import_anchor + import_line, 1)

          binding_anchor = 'const commitData = gitDataCli.commitData;\n'
          binding_line = 'const commandBenchmark = createBenchmarkCommand({ root: ROOT, runsDir: DEFAULT_RUNS_DIR });\n'
          assert text.count(binding_anchor) == 1
          assert binding_line not in text
          text = text.replace(binding_anchor, binding_anchor + binding_line, 1)

          pattern = re.compile(r'\nasync function commandBenchmark\(argv\) \{.*?\n\}\n(?=\n\nfunction printDailyRunSummary)', re.S)
          text, count = pattern.subn('\n', text, count=1)
          assert count == 1, count
          assert 'async function commandBenchmark(argv)' not in text
          assert 'await commandBenchmark([subcommand, ...rest]);' in text

          path.write_text(text)
          PY
      - name: Validate patch
        run: |
          node --check bin/x
          git diff --check -- bin/x
          git diff -- bin/x
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 1
          git commit -m "refactor(benchmark): delegate CLI entry"
          git push origin HEAD:refactor/cli-benchmark-boundary
