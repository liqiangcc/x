name: Patch codes build entry boundary

on:
  push:
    branches:
      - refactor/cli-codes-build-boundary
    paths:
      - .github/workflows/patch-codes-build-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/cli-codes-build-boundary
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Patch bin/x
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          source = path.read_text()

          import_anchor = 'const { createStocksCommand } = require("../src/adapters/cli/commands/stocks");\n'
          import_replacement = import_anchor + 'const { createCodesBuildCommand } = require("../src/adapters/cli/commands/codes_build");\n'
          assert source.count(import_anchor) == 1
          source = source.replace(import_anchor, import_replacement, 1)

          binding_anchor = 'const commandStocks = createStocksCommand({ root: ROOT, outputDir: rel(DEFAULT_UNIVERSE_DIR) });\n'
          binding_replacement = binding_anchor + 'const commandCodesBuild = createCodesBuildCommand({ root: ROOT });\n'
          assert source.count(binding_anchor) == 1
          source = source.replace(binding_anchor, binding_replacement, 1)

          start = source.index('async function commandCodesBuild(argv) {')
          end = source.index('async function commandKlineSync(argv) {', start)
          source = source[:start] + source[end:]

          assert source.count('createCodesBuildCommand') == 2
          assert 'const commandCodesBuild = createCodesBuildCommand({ root: ROOT });' in source
          assert 'async function commandCodesBuild(' not in source
          assert 'runNode("utils/parse_pool_json.js", args)' not in source
          assert 'async function commandKlineSync(' in source
          assert 'runNodeAllowFailure("fetch/fetch_market_stocks.js", [' in source
          assert 'await commandCodesBuild(rest);' in source

          path.write_text(source)
          PY

      - name: Validate patch
        run: |
          node --check bin/x
          node --check src/adapters/cli/commands/codes_build.js
          node --test \
            tests/node-script-runner.test.js \
            tests/cli-codes-build-command.test.js \
            tests/cli-codes-build-integration.test.js \
            tests/cli-stocks-command.test.js \
            tests/cli-stocks-integration.test.js \
            tests/cli-bin-x-boundary-audit.test.js
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+liqiangcc@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate codes build from CLI entry"
          git push origin HEAD:refactor/cli-codes-build-boundary
