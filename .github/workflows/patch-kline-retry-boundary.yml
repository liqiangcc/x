name: Patch Kline Retry Boundary

on:
  push:
    branches:
      - refactor/cli-kline-retry-boundary
    paths:
      - .github/workflows/patch-kline-retry-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-kline-retry-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply scoped retry entry patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'bin/x';
          let source = fs.readFileSync(file, 'utf8');

          const importAnchor = 'const { appendKlineSyncOptions, createKlineSyncCommand } = require("../src/adapters/cli/commands/kline_sync");\n';
          const importLine = 'const { createKlineRetryCommand } = require("../src/adapters/cli/commands/kline_retry");\n';
          if (!source.includes(importAnchor)) throw new Error('missing kline sync import anchor');
          if (!source.includes(importLine)) source = source.replace(importAnchor, importAnchor + importLine);

          const compositionAnchor = 'const commandKlineSync = createKlineSyncCommand({ root: ROOT });\n';
          const compositionLine = 'const commandKlineRetry = createKlineRetryCommand({ root: ROOT });\n';
          if (!source.includes(compositionAnchor)) throw new Error('missing kline sync composition anchor');
          if (!source.includes(compositionLine)) source = source.replace(compositionAnchor, compositionAnchor + compositionLine);

          const start = source.indexOf('function extractRetryCodes(payload) {');
          const end = source.indexOf('async function commandKlineRetryQueue(argv) {', start);
          if (start < 0 || end < 0) throw new Error('missing retry extraction anchors');
          source = source.slice(0, start) + source.slice(end);

          if (source.includes('async function commandKlineRetry(argv) {')) throw new Error('inline kline retry remained');
          if (source.includes('function extractRetryCodes(payload) {')) throw new Error('inline retry code extraction remained');
          if (source.includes('function inferKlineOutputDirFromSummary(')) throw new Error('inline retry output inference remained');
          if (!source.includes('async function commandKlineRetryQueue(argv) {')) throw new Error('retry queue was removed');
          if (!source.includes('async function commandDaily(argv) {')) throw new Error('daily was removed');
          if (!source.includes('await commandKlineRetry(rest);')) throw new Error('main retry delegation missing');

          fs.writeFileSync(file, source);
          NODE

          node --check bin/x
          node --check src/application/kline/retry_klines.js
          node --check src/adapters/kline/kline_retry_filesystem.js
          node --check src/adapters/kline/kline_sync_script_args.js
          node --check src/adapters/kline/kline_sync_retry_runner.js
          node --check src/adapters/cli/commands/kline_sync.js
          node --check src/adapters/cli/commands/kline_retry.js
          node --test \
            tests/application-kline-retry.test.js \
            tests/kline-sync-retry-runner.test.js \
            tests/cli-kline-retry-command.test.js \
            tests/cli-kline-retry-integration.test.js \
            tests/cli-kline-sync-command.test.js \
            tests/cli-kline-sync-integration.test.js \
            tests/cli-codes-build-integration.test.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet || git commit -m "refactor: separate kline retry from CLI entry"
          git push origin HEAD:refactor/cli-kline-retry-boundary
