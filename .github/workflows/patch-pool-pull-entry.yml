name: Patch pool pull entry boundary

on:
  push:
    branches:
      - refactor/cli-pool-pull-boundary
    paths:
      - .github/workflows/patch-pool-pull-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/cli-pool-pull-boundary
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Patch bin/x
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          source = path.read_text()

          import_anchor = 'const { createReportCommand } = require("../src/adapters/cli/commands/report");\n'
          import_replacement = import_anchor + 'const { createPoolPullCommand } = require("../src/adapters/cli/commands/pool_pull");\n'
          assert source.count(import_anchor) == 1
          source = source.replace(import_anchor, import_replacement, 1)

          binding_anchor = 'const commandReport = createReportCommand({ root: ROOT, klineDir: DEFAULT_KLINE_DIR, poolDir: DEFAULT_POOL_DIR });\n'
          binding_replacement = binding_anchor + 'const commandPoolPull = createPoolPullCommand({ root: ROOT });\n'
          assert source.count(binding_anchor) == 1
          source = source.replace(binding_anchor, binding_replacement, 1)

          start = source.index('async function commandPoolPull(argv) {')
          end = source.index('async function commandStocks(argv) {', start)
          source = source[:start] + source[end:]

          assert source.count('createPoolPullCommand') == 2
          assert 'const commandPoolPull = createPoolPullCommand({ root: ROOT });' in source
          assert 'async function commandPoolPull(' not in source
          assert 'fetch/pull_pool_task.js' not in source
          assert 'await commandPoolPull(rest);' in source
          assert 'async function commandStocks(' in source
          assert 'async function commandCodesBuild(' in source

          path.write_text(source)
          PY

      - name: Validate patch
        run: |
          node --check bin/x
          node --check src/adapters/cli/commands/pool_pull.js
          node --check src/adapters/system/node_script_runner.js
          node --test \
            tests/node-script-runner.test.js \
            tests/cli-pool-pull-command.test.js \
            tests/cli-pool-pull-integration.test.js \
            tests/cli-report-integration.test.js \
            tests/cli-bin-x-boundary-audit.test.js
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate pool pull from CLI entry"
          git push origin HEAD:refactor/cli-pool-pull-boundary
