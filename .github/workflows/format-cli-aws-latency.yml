name: Format AWS latency CLI router

on:
  push:
    branches:
      - refactor/cli-aws-latency-boundary
    paths:
      - .github/workflows/format-cli-aws-latency.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-aws-latency-boundary
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            bin/x
      - name: Format commandAws
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bin/x")
          text = path.read_text()
          start = text.index('async function commandAws(argv) {')
          end_marker = '\n}\n\nasync function commandKlineFetch'
          end = text.index(end_marker, start) + 2
          current = text[start:end]
          expected_fragments = [
            'await commandAwsProbeRouter(argv.slice(1));',
            'await commandAwsMaintenance(argv);',
            'await commandAwsLatency(argv.slice(1));',
            'parseOptions(argv.slice(1));',
            'Unknown aws command:',
          ]
          for fragment in expected_fragments:
            assert current.count(fragment) == 1, fragment

          replacement = '''async function commandAws(argv) {
            const subcommand = argv[0];
            if (subcommand === "probe-router") {
              await commandAwsProbeRouter(argv.slice(1));
              return;
            }
            if (["status", "sync-github-secrets"].includes(subcommand)) {
              await commandAwsMaintenance(argv);
              return;
            }
            if (subcommand === "latency") {
              await commandAwsLatency(argv.slice(1));
              return;
            }
            parseOptions(argv.slice(1));
            throw new Error(`Unknown aws command: ${subcommand ?? ""}`);
          }'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Validate format
        run: |
          node --check bin/x
          git diff --check -- bin/x
          git diff -- bin/x
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git diff --cached --quiet && exit 1
          git commit -m "style(aws): format latency CLI routing"
          git push origin HEAD:refactor/cli-aws-latency-boundary
