name: Patch proxy lifecycle CLI entry

on:
  push:
    branches:
      - refactor/cli-proxy-lifecycle-boundary
    paths:
      - .github/workflows/patch-proxy-lifecycle-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-proxy-lifecycle-boundary
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch bin/x
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bin/x")
          text = path.read_text()

          old = 'const { createProxyPoolRefreshGithubCommand } = require("../src/adapters/cli/commands/proxy_pool_refresh_github");\n'
          new = old + 'const { createProxyPoolLifecycleCommand } = require("../src/adapters/cli/commands/proxy_pool_lifecycle");\n'
          assert text.count(old) == 1, "proxy refresh import anchor changed"
          assert "createProxyPoolLifecycleCommand" not in text, "proxy lifecycle import already present"
          text = text.replace(old, new, 1)

          old = 'const commandProxyPoolRefreshGithub = createProxyPoolRefreshGithubCommand();\n'
          new = old + 'const commandProxyPoolLifecycle = createProxyPoolLifecycleCommand({ root: ROOT });\n'
          assert text.count(old) == 1, "proxy refresh binding anchor changed"
          assert "const commandProxyPoolLifecycle" not in text, "proxy lifecycle binding already present"
          text = text.replace(old, new, 1)

          pattern = re.compile(
              r'\nasync function proxyCompose\(args\) \{.*?\n\}\n\nasync function writeProxyBenchmarkReport',
              re.S,
          )
          text, count = pattern.subn('\nasync function writeProxyBenchmarkReport', text, count=1)
          assert count == 1, "proxyCompose function boundary changed"

          old = '  if (action === "refresh-github") {\n    await commandProxyPoolRefreshGithub(argv.slice(1));\n    return;\n  }\n  const options = parseOptions(argv.slice(1));'
          new = '  if (action === "refresh-github") {\n    await commandProxyPoolRefreshGithub(argv.slice(1));\n    return;\n  }\n  if (["up", "down"].includes(action)) {\n    await commandProxyPoolLifecycle(argv);\n    return;\n  }\n  const options = parseOptions(argv.slice(1));'
          assert text.count(old) == 1, "proxy pool routing anchor changed"
          text = text.replace(old, new, 1)

          pattern = re.compile(
              r'  if \(action === "up"\) \{\n'
              r'    await proxyCompose\(\["up", "-d", "--build"\]\);\n'
              r'    return;\n'
              r'  \}\n'
              r'  if \(action === "down"\) \{\n'
              r'    await proxyCompose\(\["down"\]\);\n'
              r'    return;\n'
              r'  \}\n',
          )
          text, count = pattern.subn('', text, count=1)
          assert count == 1, "legacy proxy lifecycle blocks changed"

          assert 'await commandProxyPoolLifecycle(argv);' in text
          assert 'async function proxyCompose' not in text
          assert 'await proxyCompose(' not in text
          assert text.count('createProxyPoolLifecycleCommand') == 2
          assert 'if (action === "diagnose")' in text
          assert 'if (action === "probe")' in text
          assert 'if (action === "benchmark")' in text
          assert 'if (action === "warmup")' in text

          path.write_text(text)
          PY
      - name: Validate patch
        run: |
          node --check bin/x
          node --test tests/cli-proxy-pool-lifecycle-command.test.js tests/proxy-docker-compose-capability.test.js tests/proxy-status-adapters.test.js
          git diff --check
          git diff -- bin/x
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git commit -m "refactor: route proxy pool lifecycle through CLI adapter"
          git push origin HEAD:refactor/cli-proxy-lifecycle-boundary
