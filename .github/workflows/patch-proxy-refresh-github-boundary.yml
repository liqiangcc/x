name: Patch proxy refresh github CLI entry

on:
  push:
    branches:
      - refactor/cli-proxy-refresh-github-boundary
    paths:
      - .github/workflows/patch-proxy-refresh-github-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cli-proxy-refresh-github-boundary
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch bin/x
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bin/x")
          text = path.read_text()

          old = 'const { createProxyPoolStatusCommand } = require("../src/adapters/cli/commands/proxy_pool_status");\n'
          new = old + 'const { createProxyPoolRefreshGithubCommand } = require("../src/adapters/cli/commands/proxy_pool_refresh_github");\n'
          assert text.count(old) == 1, "proxy status import anchor changed"
          assert "createProxyPoolRefreshGithubCommand" not in text, "refresh github import already present"
          text = text.replace(old, new, 1)

          old = 'const commandProxyPoolStatus = createProxyPoolStatusCommand({ root: ROOT });\n'
          new = old + 'const commandProxyPoolRefreshGithub = createProxyPoolRefreshGithubCommand();\n'
          assert text.count(old) == 1, "proxy status binding anchor changed"
          assert "const commandProxyPoolRefreshGithub" not in text, "refresh github binding already present"
          text = text.replace(old, new, 1)

          pattern = re.compile(
              r'\n  if \(action === "refresh-github"\) \{\n'
              r'    const \{ GithubProxyRepositoryProvider \} = require\("\.\/\.\.\/src\/proxy\/providers\/github_repository"\);\n'
              r'.*?\n  \}\n\n  if \(action === "diagnose"\)',
              re.S,
          )
          text, count = pattern.subn('\n  if (action === "diagnose")', text, count=1)
          assert count == 1, "legacy proxy refresh-github block changed"

          old = '  if (action === "status") {\n    await commandProxyPoolStatus(argv.slice(1));\n    return;\n  }\n  const options = parseOptions(argv.slice(1));'
          new = '  if (action === "status") {\n    await commandProxyPoolStatus(argv.slice(1));\n    return;\n  }\n  if (action === "refresh-github") {\n    await commandProxyPoolRefreshGithub(argv.slice(1));\n    return;\n  }\n  const options = parseOptions(argv.slice(1));'
          assert text.count(old) == 1, "commandProxyPool routing anchor changed"
          text = text.replace(old, new, 1)

          assert 'await commandProxyPoolRefreshGithub(argv.slice(1));' in text
          assert "GithubProxyRepositoryProvider" not in text
          assert "provider.listCandidates()" not in text
          assert text.count("createProxyPoolRefreshGithubCommand") == 2
          assert 'if (action === "up")' in text
          assert 'if (action === "down")' in text
          assert 'if (action === "diagnose")' in text
          assert 'if (action === "probe")' in text
          assert 'if (action === "benchmark")' in text
          assert 'if (action === "warmup")' in text

          path.write_text(text)
          PY
      - name: Validate patch
        run: |
          node --check bin/x
          node --test tests/cli-proxy-pool-refresh-github-command.test.js tests/proxy-github-provider.test.js
          git diff --check
          git diff -- bin/x
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/x
          git commit -m "refactor: route proxy refresh github through CLI adapter"
          git push origin HEAD:refactor/cli-proxy-refresh-github-boundary
